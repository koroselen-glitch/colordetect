<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f2">
<title>ColorDetect — Renk Psikolojisi Motoru</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff'/%3E%3Cpath d='M47.32 19.14A20 20 0 1 0 47.32 44.86' fill='none' stroke='%23111' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='32' r='4.6' fill='%23111'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#fff; --bg2:#f5f5f7; --ink:#1d1d1f; --ink2:#6e6e73; --line:#d2d2d7; --line2:#e8e8ed;
    --blue:#0071e3; --blue-d:#0062c4; --violet:#5e5ce6; --coral:#ff6f59;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg2);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.03em;}
  p{margin:0;color:var(--ink2);line-height:1.5;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit;}
  ::selection{background:rgba(94,92,230,.25);}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  .wrap-wide{max-width:1280px;margin:0 auto;padding:0 24px;}
  .eyebrow{font-size:14px;font-weight:600;color:var(--coral);letter-spacing:.01em;margin-bottom:12px;}
  .dark .eyebrow{color:#ff9f7a;}
  .big{font-size:clamp(40px,7vw,88px);line-height:1.04;letter-spacing:-.04em;}
  .mid{font-size:clamp(30px,4.6vw,56px);line-height:1.07;letter-spacing:-.035em;}
  .grad-text{background:linear-gradient(95deg,#7d7aff 0%,#ff6f59 52%,#ffd166 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}

  /* ---------- background layers ---------- */
  .aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 22s ease-in-out infinite;}
  .aurora i:nth-child(1){width:52vw;height:52vw;left:-14vw;top:-18vw;background:#5e5ce6;}
  .aurora i:nth-child(2){width:44vw;height:44vw;right:-12vw;top:4vw;background:#ff375f;animation-delay:-6s;opacity:.38;}
  .aurora i:nth-child(3){width:50vw;height:50vw;left:22vw;bottom:-26vw;background:#30d5c8;animation-delay:-11s;opacity:.32;}
  .aurora i:nth-child(4){width:30vw;height:30vw;right:14vw;bottom:-6vw;background:#ff9f0a;animation-delay:-3s;opacity:.28;}
  @keyframes drift{50%{transform:translate(5vw,3vw) scale(1.14);}}
  .dots::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.14) 1px,transparent 1px);background-size:26px 26px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 0%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 40%,#000 0%,transparent 72%);pointer-events:none;}
  .dark.dots::before{background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1px);}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");}

  /* ---------- NAV ---------- */
  .nav{position:sticky;top:0;z-index:100;height:48px;background:rgba(251,248,242,.86);border-bottom:1px solid rgba(0,0,0,.06);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);}
  .nav-inner{max-width:1080px;margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .logo{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;color:#111;cursor:pointer;letter-spacing:-.01em;}
  .logo .mark{width:12px;height:12px;border-radius:50%;background:conic-gradient(from 200deg,#5e5ce6,#ff375f,#ffd60a,#30d158,#5e5ce6);}
  .nav-links{display:flex;gap:30px;font-size:12px;}
  .nav-links a{color:rgba(17,17,17,.62);transition:color .2s;cursor:pointer;}
  .nav-links a:hover,.nav-links a.active{color:#000;}
  .nav-right{display:flex;align-items:center;gap:6px;}
  .pill-btn{padding:6px 14px;border-radius:980px;font-size:12px;font-weight:500;transition:.2s;color:rgba(17,17,17,.8);}
  .pill-btn:hover{color:#000;}
  .pill-btn.solid{background:#111;color:#fff;}
  .pill-btn.solid:hover{background:#333;}

  .colchips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .colchips button{display:flex;align-items:center;gap:6px;padding:4px;border-radius:980px;border:2px solid transparent;font-size:11px;color:#f5f5f7;background:rgba(255,255,255,.08);}
  .colchips button i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);}
  .colchips button:has(i)+button{}
  .colchips button[data-h=""]{padding-right:10px;}
  .colchips button.on{border-color:#fff;}
  .moodchips{display:flex;flex-wrap:wrap;gap:6px;}
  .moodchips button{padding:6px 12px;border-radius:980px;font-size:12px;color:#d1d1d6;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);transition:.2s;}
  .moodchips button.on{background:#fff;color:#111;border-color:#fff;}
  #moodText{width:100%;resize:vertical;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#f5f5f7;font:13px/1.4 var(--font);}
  #moodText::placeholder{color:#8e8e93;}
  .tips{margin-top:16px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.07);font-size:14px;line-height:1.5;color:#d1d1d6;}
  .tips ul{margin:6px 0 0 18px;padding:0;} .tips b{color:#fff;}
  .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .price{position:absolute;right:14px;bottom:12px;font-size:14px;font-weight:600;padding:6px 12px;border-radius:980px;background:rgba(255,255,255,.92);color:#111;}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px;}
  .dcard{border-radius:24px;padding:22px;}
  .dcard b{display:block;font-size:30px;letter-spacing:-.03em;} .dcard span{font-size:13px;color:var(--ink2);}
  .dcard.wide{grid-column:1/-1;}
  .dtable{width:100%;border-collapse:collapse;font-size:14px;} .dtable th{text-align:left;font-weight:500;color:var(--ink2);font-size:12px;padding:8px 10px;} .dtable td{padding:11px 10px;border-top:1px solid rgba(120,90,50,.1);vertical-align:middle;}
  .st{font-size:11.5px;padding:3px 10px;border-radius:980px;background:#eee;} .st.paid{background:#dff5e6;color:#17713a;} .st.pending_payment{background:#fff0d6;color:#8a5a00;} .st.shipped{background:#dde9ff;color:#1b4fa3;} .st.cancelled{background:#fde0dc;color:#a23a2a;}
  .lrow{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid rgba(120,90,50,.1);flex-wrap:wrap;}
  .lrow .th{width:64px;height:64px;border-radius:14px;overflow:hidden;position:relative;flex:none;}
  .lrow .info{flex:1;min-width:160px;} .lrow .info b{display:block;font-size:15px;} .lrow .info small{color:var(--ink2);font-size:12.5px;}
  .minibtn{padding:8px 14px;border-radius:980px;font-size:13px;border:1px solid var(--line);background:#fff;} .minibtn:hover{border-color:#111;}
  .minibtn.dark{background:#111;color:#fff;border-color:#111;}
  .note{padding:14px 16px;border-radius:16px;background:#fff7e6;border:1px solid #f1deb0;color:#6b4b00;font-size:13.5px;line-height:1.5;margin-bottom:20px;}
  .legal{max-width:820px;margin:0 auto;padding:46px 0 90px;} .legal h1{font-size:40px;margin-bottom:6px;} .legal h3{font-size:19px;margin:28px 0 8px;} .legal p,.legal li{font-size:15px;line-height:1.65;color:#3c3c43;} .legal ul{padding-left:20px;margin:8px 0;}
  .legal .ph{background:#fff1b8;padding:1px 5px;border-radius:4px;}
  .ltabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px;} .ltabs button{padding:8px 16px;border-radius:980px;font-size:13px;background:rgba(255,255,255,.7);border:1px solid rgba(120,90,50,.14);} .ltabs button.on{background:#111;color:#fff;}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--ink2);margin-top:12px;} .chk input{margin-top:2px;flex:none;width:auto;} .chk a{color:var(--blue);cursor:pointer;text-decoration:underline;}
  .buybox{margin-top:20px;padding:18px;border-radius:20px;background:#fff;border:1px solid rgba(120,90,50,.12);} .buybox .p{font-size:30px;font-weight:700;letter-spacing:-.03em;}
  footer a{cursor:pointer;} footer a:hover{color:#111;}
  .light-v .colchips button{color:#f5f5f7;}
  .field textarea,.field input[type=number]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);font:15px var(--font);background:#fff;}
  /* ---------- buttons ---------- */
  .btn-lg{padding:13px 26px;border-radius:980px;font-size:16px;font-weight:500;transition:.25s var(--ease);display:inline-block;}
  .btn-lg.primary{background:var(--blue);color:#fff;}
  .btn-lg.primary:hover{background:var(--blue-d);transform:scale(1.03);}
  .btn-lg.secondary{background:transparent;color:var(--blue);border:1px solid var(--blue);}
  .btn-lg.secondary:hover{background:var(--blue);color:#fff;}
  .dark .btn-lg.secondary{color:#2997ff;border-color:#2997ff;}
  .dark .btn-lg.secondary:hover{background:#2997ff;color:#fff;}
  .link-arrow{color:var(--blue);font-size:17px;cursor:pointer;}
  .link-arrow:hover{text-decoration:underline;}
  .dark .link-arrow{color:#2997ff;}

  /* ---------- reveal ---------- */
  .rv{opacity:0;transform:translateY(40px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease);}
  .rv.in{opacity:1;transform:none;}
  .rv.d1{transition-delay:.08s;}.rv.d2{transition-delay:.16s;}.rv.d3{transition-delay:.24s;}.rv.d4{transition-delay:.32s;}
  @media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none;}.aurora i{animation:none;}}

  /* ---------- sections ---------- */
  section{position:relative;}
  .sec{padding:120px 0;}
  .dark{background:#000;color:#f5f5f7;}
  .dark p{color:#a1a1a6;}
  .light{background:var(--bg2);}
  .white{background:#fff;}
  .section-head{text-align:center;max-width:760px;margin:0 auto 64px;position:relative;z-index:1;}
  .section-head p{font-size:21px;margin-top:18px;line-height:1.4;}

  /* HERO */
  .hero{position:relative;min-height:calc(100vh - 48px);min-height:calc(100svh - 48px);display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;background:#000;color:#f5f5f7;}
  .hero3d{position:absolute;inset:0;z-index:1;}
  .hero3d canvas{display:block;width:100%;height:100%;}
  .hero-content{position:relative;z-index:2;max-width:900px;padding:0 24px;pointer-events:none;}
  .hero-content .btn-lg,.hero-content a{pointer-events:auto;}
  .hero .pre{font-size:19px;font-weight:600;color:#ff9f7a;margin-bottom:18px;}
  .hero p.sub{font-size:clamp(18px,2.2vw,24px);color:#c7c7cc;margin:26px auto 0;max-width:620px;line-height:1.35;}
  .hero-cta{display:flex;gap:14px;justify-content:center;margin-top:38px;flex-wrap:wrap;}
  .scroll-hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:2;width:22px;height:36px;border:1.5px solid rgba(255,255,255,.35);border-radius:12px;}
  .scroll-hint::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:#fff;animation:scrollDot 1.8s ease-in-out infinite;}
  @keyframes scrollDot{0%{opacity:0;transform:translateY(0);}30%{opacity:1;}100%{opacity:0;transform:translateY(12px);}}

  /* marquee */
  .marquee{background:#000;overflow:hidden;padding:0 0 70px;position:relative;}
  .marquee-track{display:flex;gap:14px;width:max-content;animation:marq 60s linear infinite;}
  .chip-pal{display:flex;border-radius:18px;overflow:hidden;height:64px;width:230px;flex-shrink:0;box-shadow:0 12px 30px rgba(0,0,0,.4);}
  .chip-pal span{flex:1;}
  @keyframes marq{to{transform:translateX(-50%);}}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center;position:relative;z-index:1;}
  .stat b{display:block;font-size:clamp(48px,7vw,84px);font-weight:700;letter-spacing:-.045em;line-height:1;background:linear-gradient(180deg,#1d1d1f 30%,#86868b);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat span{display:block;margin-top:10px;font-size:17px;color:var(--ink2);}

  /* bento */
  .bento{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;position:relative;z-index:1;}
  .tile{border-radius:30px;padding:40px;position:relative;overflow:hidden;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.04);transition:transform .5s var(--ease);}
  .tile:hover{transform:scale(1.012);}
  .tile h3{font-size:clamp(24px,2.6vw,34px);line-height:1.1;margin-bottom:10px;position:relative;z-index:1;}
  .tile p{font-size:17px;position:relative;z-index:1;}
  .tile .num{position:absolute;top:30px;left:40px;font-family:var(--mono);font-size:13px;opacity:.6;z-index:1;}
  .t-a{grid-column:span 3;background:linear-gradient(150deg,#2a2a6e,#5e5ce6 60%,#8e8cff);color:#fff;}
  .t-b{grid-column:span 3;background:linear-gradient(150deg,#5c1d33,#ff375f 65%,#ff9f7a);color:#fff;}
  .t-c{grid-column:span 6;background:linear-gradient(120deg,#06302c,#0a8f84 60%,#6fe3c7);color:#fff;min-height:340px;}
  .t-a p,.t-b p,.t-c p{color:rgba(255,255,255,.82);}
  .tile .orbs{position:absolute;inset:0;pointer-events:none;}
  .tile .orbs i{position:absolute;border-radius:50%;filter:blur(2px);opacity:.9;}

  /* hue explorer */
  .hue-sec{transition:background .8s;overflow:hidden;--glow:#0a84ff;background:#000;}
  .hue-glow{position:absolute;left:50%;top:48%;width:min(900px,120vw);height:min(900px,120vw);transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,var(--glow) 0%,transparent 62%);opacity:.42;filter:blur(30px);transition:background .9s,opacity .9s;pointer-events:none;}
  .hue-dots{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:44px;position:relative;z-index:1;}
  .hue-dot{width:54px;height:54px;border-radius:50%;border:3px solid transparent;transition:.35s var(--ease);box-shadow:0 8px 22px rgba(0,0,0,.45);position:relative;}
  .hue-dot:hover{transform:scale(1.12);}
  .hue-dot.on{border-color:#fff;transform:scale(1.18);}
  .hue-card{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;max-width:980px;margin:0 auto;padding:44px;border-radius:34px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);}
  .hue-card h3{font-size:clamp(34px,5vw,56px);}
  .hue-card .lead{font-size:20px;color:#d2d2d7;margin-top:12px;line-height:1.35;}
  .meter{margin-bottom:18px;}
  .meter .row{display:flex;justify-content:space-between;font-size:13px;color:#a1a1a6;margin-bottom:7px;}
  .meter .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;}
  .meter .bar i{display:block;height:100%;width:0;border-radius:8px;background:var(--glow);transition:width 1s var(--ease),background .9s;}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
  .tag{font-size:12px;padding:6px 12px;border-radius:980px;background:rgba(0,113,227,.1);color:var(--blue-d);}
  .dark .tag,.glass .tag{background:rgba(255,255,255,.1);color:#e5e5ea;}
  .fine{font-size:12px;color:#86868b;text-align:center;margin-top:32px;position:relative;z-index:1;}

  /* age */
  .ages{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;position:relative;z-index:1;}
  .age{background:#fff;border-radius:26px;padding:22px 22px 26px;transition:transform .5s var(--ease),box-shadow .5s;}
  .age:hover{transform:translateY(-8px);box-shadow:0 30px 60px rgba(0,0,0,.1);}
  .age .sw{height:130px;border-radius:18px;margin-bottom:18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);}
  .age h4{font-size:19px;}
  .age .yr{font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin:4px 0 10px;}
  .age p{font-size:14px;}

  /* use-case grid */
  .uses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;position:relative;z-index:1;}
  .use{border-radius:26px;padding:30px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:.4s var(--ease);}
  .use:hover{background:rgba(255,255,255,.1);transform:translateY(-4px);}
  .use .dotrow{display:flex;margin-bottom:22px;}
  .use .dotrow i{width:26px;height:26px;border-radius:50%;margin-right:-8px;border:2px solid #111;}
  .use h4{font-size:21px;margin-bottom:6px;}
  .use p{font-size:15px;}

  .cta{text-align:center;overflow:hidden;}
  .cta .inner{position:relative;z-index:2;}

  /* ---------- forms ---------- */
  .field{margin-top:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--f2,var(--ink2));margin-bottom:7px;letter-spacing:.01em;}
  .field input[type=text],.field input[type=email],.field input[type=password],.field input[type=tel],.field select{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--fl,var(--line));background:var(--fb,#fff);font-size:15px;color:var(--f1,var(--ink));font-family:var(--font);
    appearance:none;-webkit-appearance:none;transition:border-color .2s, box-shadow .2s;}
  .field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a1a1a6' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:36px;}
  .field select option{color:#1d1d1f;background:#fff;}
  .field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.18);outline:none;}

  .glass{--f1:#f5f5f7;--f2:#a1a1a6;--fl:rgba(255,255,255,.16);--fb:rgba(255,255,255,.07);
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border-radius:30px;color:#f5f5f7;}
  .glass p{color:#a1a1a6;}

  .btn-analyze{width:100%;margin-top:22px;padding:15px;border-radius:14px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;transition:.25s var(--ease);}
  .btn-analyze:hover{background:var(--blue-d);transform:scale(1.015);}
  .btn-analyze:disabled{background:rgba(120,120,128,.35);color:rgba(255,255,255,.6);cursor:not-allowed;transform:none;}
  .btn-save{flex:1;padding:13px;border-radius:12px;background:#f5f5f7;color:#1d1d1f;font-size:14px;font-weight:600;transition:.2s;}
  .btn-save:hover{background:#fff;}
  .btn-save.secondary{background:transparent;border:1px solid rgba(255,255,255,.25);color:#f5f5f7;}
  .btn-save.secondary:hover{border-color:#fff;}
  .light-page .btn-save{background:var(--ink);color:#fff;}
  .light-page .btn-save:hover{background:#000;}
  .light-page .btn-save.secondary{border-color:var(--line);color:var(--ink);background:#fff;}

  /* ---------- ANALYZE / STUDIO ---------- */
  .studio-sec{background:#000;color:#f5f5f7;padding:64px 0 100px;overflow:hidden;min-height:calc(100vh - 48px);}
  .page-head{text-align:center;margin-bottom:46px;position:relative;z-index:1;}
  .page-head p{font-size:19px;margin-top:14px;color:#a1a1a6;}
  .studio{display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start;position:relative;z-index:1;}
  .panel{padding:28px;}
  .panel h3{font-size:17px;margin-bottom:4px;}

}

async function api(path, opts={}){
  const headers=Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(AUTH && AUTH.token) headers['Authorization']='Bearer '+AUTH.token;
  const res=await fetch(API_BASE+path,{...opts,headers,body:opts.body?JSON.stringify(opts.body):undefined});
  let data=null; try{ data=await res.json(); }catch(e){}
  if(!res.ok){ throw new Error((data&&data.error)||`Sunucu hatası (${res.status})`); }
  return data;
}

/* ============ SCROLL REVEAL + COUNTERS ============ */
let IO=null;
function observeReveals(){
  if(!IO && 'IntersectionObserver' in window){
    IO=new IntersectionObserver(es=>{
      es.forEach(e=>{
        if(e.isIntersecting){
          e.target.classList.add('in');
          if(e.target.dataset.count) countUp(e.target);
          IO.unobserve(e.target);
        }
      });
    },{threshold:.15,rootMargin:'0px 0px -6% 0px'});
  }
  document.querySelectorAll('.rv,[data-count]').forEach(el=>{ if(IO) IO.observe(el); else el.classList.add('in'); });
}
function countUp(el){
  const to=+el.dataset.count, t0=performance.now(), dur=1600;
  (function step(now){
    const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,4);
    el.textContent=Math.round(to*e);

function _cutout(img,cut,maskImg){

  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0,w,h);
  const id=x.getImageData(0,0,w,h), d=id.data, N=w*h;

    if(maskImg){ const mc=document.createElement('canvas'); mc.width=w; mc.height=h; const mx2=mc.getContext('2d',{willReadFrequently:true}); mx2.drawImage(maskImg,0,0,w,h);
      const md=mx2.getImageData(0,0,w,h).data; for(let i=0;i<N;i++) fg[i]=md[i*4+3]>110?1:0; }
    else {
    // kenar piksellerinden arka plan rengi
    const edge=[]; for(let i=0;i<w;i++){ edge.push(i,(h-1)*w+i); } for(let j=0;j<h;j++){ edge.push(j*w,j*w+w-1); }
    let mr=0,mg=0,mb=0; edge.forEach(p=>{ mr+=d[p*4]; mg+=d[p*4+1]; mb+=d[p*4+2]; });
    mr/=edge.length; mg/=edge.length; mb/=edge.length;
    let v=0; edge.forEach(p=>{ v+=(d[p*4]-mr)**2+(d[p*4+1]-mg)**2+(d[p*4+2]-mb)**2; });
    const sd=Math.sqrt(v/edge.length/3); bgSd=sd; const T=Math.min(95,Math.max(34,sd*2.4+26));
    const isBg=p=>{ const dr=d[p*4]-mr,dg=d[p*4+1]-mg,db=d[p*4+2]-mb; return Math.sqrt(dr*dr+dg*dg+db*db)<T; };

  rr(120,255,280,70,28,p[3]); rr(95,355,26,60,10,p[4]); rr(399,355,26,60,10,p[4]); return c.toDataURL('image/png'); }

/* hero: yüzen camsı küreler */
function mountHero(container){
  container.innerHTML='';
  if(!can3D()) return;
  let renderer;
  try{ renderer=new THREE.WebGLRenderer({antialias:true,alpha:true}); }catch(e){ return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping;
  container.appendChild(renderer.domElement);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(35,1,.1,60); camera.position.z=13;
  scene.add(new THREE.AmbientLight(0xffffff,.4));
  const l1=new THREE.DirectionalLight(0xffffff,1.1); l1.position.set(4,6,9); scene.add(l1);
  const l2=new THREE.PointLight(0xff6f59,1.6,40); l2.position.set(-9,-3,5); scene.add(l2);
  const l3=new THREE.PointLight(0x5e5ce6,1.8,40); l3.position.set(9,4,3); scene.add(l3);
  const defs=[[-5.6,1.7,-1,1.55,.62],[-3.4,-2.7,1,.9,.08],[5.3,2.1,-1,1.25,.9],[3.6,-2.5,0,1.05,.15],[.2,3.7,-3,.6,.12],[-1.2,-3.9,-2,.5,.5],[7.2,-.6,-2,.62,.75],[-7.6,-1,-2,.55,.35],[1.8,2.9,-4,.4,.58]];
  const items=defs.map(([x,y,z,r,h],i)=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(r,64,48),new THREE.MeshPhysicalMaterial({color:new THREE.Color().setHSL(h,.75,.58).convertSRGBToLinear(),roughness:.2,metalness:0,clearcoat:1,clearcoatRoughness:.12}));
    m.position.set(x,y,z); scene.add(m); return {m,x,y,z,r,h,ph:i*1.7,sp:.4+((i*13)%7)/10};
  });
  const ring=new THREE.Mesh(new THREE.TorusGeometry(2.1,.045,24,160),new THREE.MeshPhysicalMaterial({color:srgbSafe('#ffffff'),roughness:.2,metalness:.9}));
  ring.position.set(0,0,-4); ring.rotation.x=1.1; scene.add(ring);
  function srgbSafe(h){ return new THREE.Color(h).convertSRGBToLinear(); }
  let mx=0,my=0,sx=1;
  function resize(){
    const w=container.clientWidth,h=container.clientHeight; if(!w||!h) return;
    renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
    sx=Math.min(1,camera.aspect*.85);
    items.forEach(it=>{ it.m.position.x=it.x*sx; const k=Math.min(1,.55+sx*.45); it.m.scale.setScalar(k); });
  }
  resize();
  const ro=('ResizeObserver' in window)?new ResizeObserver(resize):null; if(ro) ro.observe(container);
  const mv=e=>{ mx=(e.clientX/window.innerWidth-.5); my=(e.clientY/window.innerHeight-.5); };
  window.addEventListener('pointermove',mv);
  let alive=true, raf=0, visible=true, t0=performance.now();
  const vio=('IntersectionObserver' in window)?new IntersectionObserver(es=>{ visible=es[0].isIntersecting; }):null; if(vio) vio.observe(container);
  (function frame(now){
    if(!alive) return; raf=requestAnimationFrame(frame);
    if(!visible) return;
    const t=(now-t0)/1000;
    items.forEach(it=>{
      it.m.position.y=it.y+Math.sin(t*it.sp+it.ph)*.42;
      it.m.position.z=it.z+Math.cos(t*it.sp*.8+it.ph)*.3;
      it.m.material.color.setHSL((it.h+t*.012)%1,.75,.58).convertSRGBToLinear();
    });
    ring.rotation.z=t*.12; ring.rotation.y=Math.sin(t*.2)*.4;
    camera.position.x+=(mx*2.2-camera.position.x)*.04;
    camera.position.y+=(-my*1.6-camera.position.y)*.04;
    camera.lookAt(0,0,0);
    renderer.render(scene,camera);
  })(t0);
  CLEAN3D.push(()=>{
    alive=false; cancelAnimationFrame(raf); window.removeEventListener('pointermove',mv);
    if(ro) ro.disconnect(); if(vio) vio.disconnect();
    scene.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
    renderer.dispose(); try{ renderer.forceContextLoss(); }catch(e){}
    if(renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
  });
}

function onFileChosen(ev){
  const file=ev.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const maxW=1000, scale=Math.min(1,maxW/img.width);
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      S.imgDataUrl=c.toDataURL('image/jpeg',.85);
      S.imgBase64=S.imgDataUrl.split(',')[1];
      S.imgMediaType='image/jpeg';
      S.result=null;
      render();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);

function barChart(daily){
  const w=700,h=170,pad=24, max=Math.max(1,...daily.map(d=>Number(d.revenue)||0), ...daily.map(d=>(Number(d.orders)||0)*100));
  const bw=(w-pad*2)/daily.length;
  const bars=daily.map((d,i)=>{ const v=Number(d.revenue)||0, o=Number(d.orders)||0; const val=v>0?v:o*100; const bh=Math.max(2,(val/max)*(h-40));
    return `<rect x="${pad+i*bw+2}" y="${h-24-bh}" width="${bw-4}" height="${bh}" rx="4" fill="${v>0?'#111':'#d9cdb8'}"><title>${d.day}: ${fmtTry(v)} · ${o} sipariş</title></rect>`; }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Son 30 gün satış grafiği">${bars}<text x="${pad}" y="${h-6}" font-size="11" fill="#8a7f6c">30 gün önce</text><text x="${w-pad}" y="${h-6}" font-size="11" fill="#8a7f6c" text-anchor="end">bugün</text></svg>`;
}

    return `<div class="light-page"><section class="m-body"><div class="wrap"><div class="empty">Profilini görmek için giriş yap.<br><button class="btn-lg primary" onclick="openAuthModal('login')">Giriş Yap</button></div></div></section></div>`;
  }
  if(PROFILE_MINE===null||PROFILE_SAVED===null||PROFILE_ME===null){ loadProfile(); return `<div class="light-page"><section class="m-body"><div class="wrap-wide"><div class="product-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div></section></div>`; }
  const pub=PROFILE_MINE.filter(p=>p.is_public).length;
  const counts={}; PROFILE_MINE.forEach(p=>counts[p.purpose]=(counts[p.purpose]||0)+1);
  const top=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  return `
  <div class="light-page">
  <section class="m-body">
    <div class="wrap-wide">
      <div class="p-head rv"><div class="avatar">${esc((AUTH.user.name||'?').charAt(0).toUpperCase())}</div>
        <div><h2 style="font-size:36px;">${esc(AUTH.user.name)}</h2><p>${esc(AUTH.user.email||'')}</p></div></div>
      <div class="kpis">
        <div class="kpi rv"><b>${PROFILE_MINE.length}</b><span>Analiz</span></div>
        <div class="kpi rv d1"><b>${pub}</b><span>Herkese açık</span></div>
        <div class="kpi rv d2"><b>${PROFILE_SAVED.length}</b><span>Kaydedilen</span></div>
        <div class="kpi rv d3"><b style="font-size:22px;line-height:1.5;">${top?label(PURPOSE_OPTS,top).split(' (')[0]:'—'}</b><span>En çok kullanılan amaç</span></div>
      </div>
      ${renderSeller()}
      <div class="m-title"><h3>Analizlerim</h3><span>Özel ve herkese açık</span></div>
      <div class="product-grid" style="margin-bottom:60px;">
        ${PROFILE_MINE.length?PROFILE_MINE.map(p=>productCard(p,p.is_public)).join(''):'<div class="empty">Henüz bir analizin yok.<br><button class="btn-lg primary" onclick="setView(\'analyze\')">İlk analizini yap</button></div>'}
      </div>
      ${profileEditHtml()}
      <div class="m-title"><h3>Hesap ve güvenlik</h3><span>Oturumlar, şifre, veri</span></div>
      <div class="d-card" style="max-width:640px;margin-bottom:60px;">
        <div class="field" style="margin-top:0"><label>Mevcut şifre</label><input type="password" id="pwCur" autocomplete="current-password"></div>
        <div class="field"><label>Yeni şifre (8-72 karakter)</label><input type="password" id="pwNew" autocomplete="new-password"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;">
          <button class="btn-lg primary" style="padding:10px 20px;font-size:14px;" onclick="changePassword()">Şifreyi değiştir</button>
          <button class="btn-lg secondary" style="padding:10px 20px;font-size:14px;" onclick="logoutAll()">Tüm cihazlardan çıkış yap</button>
        </div>
        <div style="margin-top:26px;padding-top:22px;border-top:1px solid var(--line2);">
          <h4 style="font-size:16px;">İki adımlı doğrulama</h4>
          <p style="font-size:13.5px;margin:6px 0 14px;">${PROFILE_ME&&PROFILE_ME.totpEnabled?'Açık. Girişte authenticator kodu istenir.':'Kapalı. Google Authenticator gibi bir uygulamayla hesabını ikinci bir adımla koru.'}</p>
          ${PROFILE_ME&&PROFILE_ME.totpEnabled
            ?'<button class="btn-lg secondary" style="padding:10px 20px;font-size:14px;" onclick="disableMfa()">İki adımlıyı kapat</button>'
            :'<button class="btn-lg primary" style="padding:10px 20px;font-size:14px;" onclick="startMfaSetup()">İki adımlıyı aç</button>'}
        </div>
        <div style="margin-top:26px;padding-top:22px;border-top:1px solid var(--line2);">
          <h4 style="font-size:16px;">Kişisel verilerin (KVKK)</h4>
          <p style="font-size:13.5px;margin:6px 0 14px;">Verilerinin bir kopyasını indirebilir, pazarlama iznini değiştirebilir ve hesabını silebilirsin. <a style="color:var(--blue);cursor:pointer;text-decoration:underline" onclick="openLegal('haklar')">Haklarını gör</a></p>
          <button class="btn-lg secondary" style="padding:10px 20px;font-size:14px;" onclick="downloadMyData()">Verilerimi indir</button>
          <label class="chk" style="margin-top:14px"><input type="checkbox" onchange="setMarketing(this.checked)" ${PROFILE_ME&&PROFILE_ME.marketingOk?'checked':''}><span>Kampanya e-postaları almak istiyorum</span></label>
        </div>
        <p style="font-size:13px;margin-top:22px;">Hesabını silersen tüm analizlerin, beğenilerin ve yorumların kalıcı olarak silinir.</p>
        <button class="btn-lg secondary" style="padding:10px 20px;font-size:14px;margin-top:10px;color:#c0442f;border-color:#c0442f;" onclick="deleteAccount()">Hesabımı sil</button>
      </div>

      <div class="m-title"><h3>Kaydettiklerim</h3></div>
      <div class="product-grid">
        ${PROFILE_SAVED.length?PROFILE_SAVED.map(p=>productCard(Object.assign({purpose:'home',age_group:'adult',place:'indoor'},p),true)).join(''):'<div class="empty">Henüz kaydettiğin bir şey yok.</div>'}
      </div>
    </div>
  </section></div>`;
}

async function changePassword(){
  const cur=document.getElementById('pwCur').value, nw=document.getElementById('pwNew').value;
  if(!nw) return toast('Yeni şifreyi yaz.');
  try{ const d=await api('/api/auth/password',{method:'POST',body:{currentPassword:cur,newPassword:nw}});
    setAuth({user:AUTH.user,token:d.token}); document.getElementById('pwCur').value=''; document.getElementById('pwNew').value='';
    toast('Şifre değişti. Diğer cihazlardaki oturumlar kapatıldı.'); }catch(e){ toast(e.message); }
}
window.changePassword=changePassword;
async function logoutAll(){
  try{ await api('/api/auth/logout-all',{method:'POST'}); toast('Tüm cihazlardan çıkış yapıldı.'); logout(); }catch(e){ toast(e.message); }
}
window.logoutAll=logoutAll;
async function deleteAccount(){
  const pw=prompt('Hesabını kalıcı olarak silmek için şifreni yaz (Google ile açtıysan boş bırak):');
  if(pw===null) return;
  try{ await api('/api/auth/account',{method:'DELETE',body:{password:pw}}); toast('Hesabın silindi.'); logout(); }catch(e){ toast(e.message); }
}
window.deleteAccount=deleteAccount;

function loadQr(cb){
  if(window.QRCode) return cb(true);
  const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  sc.onload=()=>cb(!!window.QRCode); sc.onerror=()=>cb(false); document.head.appendChild(sc);
}
async function startMfaSetup(){
  try{
    const d=await api('/api/auth/2fa/setup',{method:'POST'});
    document.getElementById('modalRoot').innerHTML=`
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal">
      <span class="modal-close" onclick="closeModal()">✕</span>
      <h2>İki adımlı doğrulama</h2>
      <p class="sub">1) Authenticator uygulamanda (Google Authenticator, Microsoft Authenticator, 1Password…) yeni hesap ekle ve QR kodu okut. 2) Uygulamadaki 6 haneli kodu aşağı yaz.</p>
      <div id="qrBox" style="display:flex;justify-content:center;margin:18px 0 8px;min-height:160px;align-items:center;"></div>
      <p style="font-size:12px;text-align:center;">QR çalışmazsa bu anahtarı elle gir:</p>
      <p style="font-family:var(--mono);font-size:13px;text-align:center;color:var(--ink);word-break:break-all;margin-top:4px;user-select:all;">${esc(d.secret)}</p>
      <div class="field"><label>Uygulamadaki kod</label><input type="text" id="mfaSetupCode" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" onkeydown="if(event.key==='Enter')enableMfa()"></div>
      <button class="btn-analyze" id="authSubmitBtn" onclick="enableMfa()">Etkinleştir</button>
      <div id="authErrorArea"></div></div></div>`;
    loadQr(ok=>{ const b=document.getElementById('qrBox'); if(ok&&b){ new QRCode(b,{text:d.otpauth,width:168,height:168}); } });
  }catch(e){ toast(e.message); }
}
window.startMfaSetup=startMfaSetup;
async function enableMfa(){
  const code=document.getElementById('mfaSetupCode').value.trim();
  if(!code) return showAuthError('Kodu gir.');
  try{
    const d=await api('/api/auth/2fa/enable',{method:'POST',body:{code}});
    PROFILE_ME=null;
    document.getElementById('modalRoot').innerHTML=`
    <div class="modal-backdrop"><div class="modal">
      <h2>Yedek kodların</h2>
      <p class="sub">Telefonunu kaybedersen bu kodlarla giriş yapabilirsin. Her kod bir kez kullanılır ve <b>bir daha gösterilmeyecek</b>. Güvenli bir yere kaydet.</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0;font-family:var(--mono);font-size:14px;color:var(--ink);background:#f5f5f7;padding:16px;border-radius:14px;user-select:all;">${d.backupCodes.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
      <button class="btn-analyze" onclick="closeModal();render();">Kaydettim</button></div></div>`;
  }catch(e){ showAuthError(e.message); }
}
window.enableMfa=enableMfa;
async function disableMfa(){
  const password=(PROFILE_ME&&PROFILE_ME.hasPassword)?prompt('Şifreni yaz:'):'';
  if(password===null) return;
  const code=prompt('Authenticator kodunu (ya da bir yedek kodu) yaz:');
  if(!code) return;
  try{ await api('/api/auth/2fa/disable',{method:'POST',body:{code,password}}); PROFILE_ME=null; toast('İki adımlı doğrulama kapatıldı.'); render(); }
  catch(e){ toast(e.message); }
}
window.disableMfa=disableMfa;

function openLegal(k){ S.legal=k||'aydinlatma'; setView('legal'); }
window.openLegal=openLegal;
function renderLegal(){
  const k=LEGAL[S.legal]?S.legal:'aydinlatma';
  return `<div class="light-page"><section class="m-body"><div class="legal">
    <h1>${LEGAL[k][0]}</h1>
    <div class="ltabs">${Object.keys(LEGAL).map(x=>`<button class="${x===k?'on':''}" onclick="openLegal('${x}')">${LEGAL[x][0].replace(' (KVKK)','')}</button>`).join('')}</div>
    ${LEGAL[k][1]()}
    <p style="margin-top:30px;font-size:12px;color:#8a7f6c">Son güncelleme: ${new Date().toLocaleDateString('tr-TR')}. Bu metin bir taslaktır; yayınlamadan önce bir hukuk danışmanı tarafından incelenmelidir.</p>
  </div></section></div>`;
}

const SOC={ q:'', results:null, companies:null, feed:null, profile:null, boards:null, board:null, convs:null, thread:[], peer:null, draft:'', chatProduct:null, unread:0, abort:null, matches:null };
function initial(n){ return esc((n||'?').charAt(0).toUpperCase()); }
function isMe(id){ return !!(AUTH&&AUTH.user&&AUTH.user.id===id); }
function needLogin(msg){ if(AUTH) return false; openAuthModal('login'); if(msg) toast(msg); return true; }
function miniCard(p,who){
  return `<div class="product-card rv in" onclick="openProduct('${p.id}')">
    <div class="product-thumb" style="background:${gradOf(p.palette)}">${p.has_image?`<img class="pimg" loading="lazy" src="${imgUrl(p.id)}" alt="">`:''}<div class="dotsr">${p.palette.map(c=>`<i style="background:${c.hex}"></i>`).join('')}</div>${p.price_kurus?`<span class="price">${fmtTry(p.price_kurus)}</span>`:''}</div>
    <div class="product-body">${who?`<div class="who" onclick="event.stopPropagation();openUser('${esc(who)}')" style="cursor:pointer">@${esc(who)}</div>`:''}<h3>${esc(p.title||p.ai_object_type||'Ürün')}</h3>
      <div class="meta-row"><span>♥ ${p.like_count||0}</span><span>💬 ${p.comment_count||0}</span></div></div></div>`;
}
function followBtn(u){
  if(isMe(u.id)) return '';
  return `<button class="btn-lg ${u.is_following?'secondary':'primary'} fbtn" data-uid="${u.id}" style="padding:8px 18px;font-size:13.5px" onclick="event.stopPropagation();toggleFollow('${u.id}')">${u.is_following?'Takiptesin':'Takip et'}</button>`;
}
function personRow(u){
  return `<div class="person" onclick="openUser('${esc(u.handle)}')"><div class="avatar sm">${initial(u.company_name||u.name)}</div>
    <div class="pinfo"><b>${esc(u.company_name||u.name)}${u.account_type==='company'?' <span class="cbadge">Şirket</span>':''}</b><span>@${esc(u.handle)} · ${u.followers} takipçi${u.product_count!==undefined?` · ${u.product_count} ürün`:''}</span></div>${followBtn(u)}</div>`;
}
async function toggleFollow(id){
  if(needLogin('Takip etmek için giriş yap.')) return;
  try{
    const d=await api(`/api/users/${id}/follow`,{method:'POST'});
    document.querySelectorAll(`.fbtn[data-uid="${id}"]`).forEach(b=>{ b.textContent=d.following?'Takiptesin':'Takip et'; b.className='btn-lg '+(d.following?'secondary':'primary')+' fbtn'; });
    if(SOC.profile&&SOC.profile.user.id===id){ SOC.profile.user.followers+=d.following?1:-1; SOC.profile.user.is_following=d.following; const el=document.getElementById('followersCount'); if(el) el.textContent=SOC.profile.user.followers; }
    if(PRODUCT_STATE&&PRODUCT_STATE.user_id===id) PRODUCT_STATE.author_followed=d.following;
    SOC.feed=null;
  }catch(e){ toast(e.message); }
}
window.toggleFollow=toggleFollow;

/* ---- Rehberden arkadaş bul (numaralar tarayıcıda SHA-256'lanır, saklanmaz) ---- */
function normPhone(p){
  let s=String(p).replace(/[\s()\-.]/g,''); if(s.startsWith('00')) s='+'+s.slice(2);
  if(s.startsWith('+')) return /^\+\d{10,15}$/.test(s)?s:null;
  if(!/^\d+$/.test(s)) return null;
  if(s.length===11&&s[0]==='0') return '+90'+s.slice(1);
  if(s.length===10&&s[0]==='5') return '+90'+s;
  if(s.length===12&&s.startsWith('90')) return '+'+s;
  return null;
}
async function sha256hex(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function openContactsModal(){
  if(needLogin('Rehberden arkadaş bulmak için giriş yap.')) return;
  const canPick=('contacts' in navigator)&&('ContactsManager' in window);
  document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal">
    <span class="modal-close" onclick="closeModal()">✕</span><h2>Rehberden arkadaş bul</h2>
    <p class="sub">Rehberindeki numaralar tarayıcında şifrelenir; sunucuya yalnızca şifreli özetler gönderilir, eşleşme sonrası <b>hiçbir numara saklanmaz</b>. Sadece telefonla bulunmaya izin veren kullanıcılar görünür.</p>
    <input type="file" id="vcfInput" accept=".vcf,.csv,text/vcard,text/csv,text/plain" style="display:none" onchange="onContactsFile(event)">
    ${canPick?`<button class="btn-analyze" onclick="pickContacts()">Rehberimi seç</button>`:''}
    <button class="btn-analyze" style="${canPick?'background:transparent;color:var(--blue);border:1px solid var(--blue);':''}" onclick="document.getElementById('vcfInput').click()">Rehber dosyası yükle (.vcf / .csv)</button>
    <p style="font-size:12.5px;margin-top:14px;color:var(--ink2)">${canPick?'':'Bu tarayıcı rehbere doğrudan erişemiyor. Telefonundan rehberi “.vcf” olarak dışa aktarıp buraya yükleyebilirsin (iPhone: Kişiler › Paylaş; Android: Kişiler › Dışa aktar).'}</p>
  </div></div>`;
}
window.openContactsModal=openContactsModal;
async function pickContacts(){
  try{ const picked=await navigator.contacts.select(['tel'],{multiple:true}); const tels=[]; picked.forEach(c=>(c.tel||[]).forEach(t=>tels.push(t))); await matchTels(tels); }
  catch(e){ if(e&&e.name!=='AbortError') toast('Rehbere erişilemedi.'); }
}
window.pickContacts=pickContacts;
async function onContactsFile(ev){
  const f=ev.target.files[0]; if(!f) return;
  const text=await f.text(); const m=text.match(/\+?\d[\d\s().\-]{8,}\d/g)||[];
  await matchTels(m);
}
window.onContactsFile=onContactsFile;
async function matchTels(tels){
  const set=new Set(); tels.forEach(t=>{ const n=normPhone(t); if(n) set.add(n); });
  if(!set.size){ toast('Geçerli numara bulunamadı.'); return; }
  try{
    const hashes=await Promise.all([...set].slice(0,2000).map(sha256hex));
    const d=await api('/api/contacts/match',{method:'POST',body:{hashes}});
    SOC.matches=d.items; SOC.q=''; closeModal();
    if(S.view!=='people') setView('people'); else render();
    toast(d.items.length?`${d.items.length} kişi ColorDetect’te.`:'Rehberindekilerden henüz kimse ColorDetect’te değil.');
  }catch(e){ toast(e.message); }
}
function inviteFriends(){

  if(navigator.share){ navigator.share({title:'ColorDetect',text,url}).catch(()=>{}); }

/* ---- Mesajlaşma (canlı: Server-Sent Events) ---- */
function setUnread(n){ SOC.unread=Math.max(0,n); const b=document.getElementById('msgBadge'); if(b){ b.textContent=SOC.unread; b.style.display=SOC.unread?'inline-block':'none'; } }
async function refreshUnread(){ if(!AUTH) return; try{ setUnread((await api('/api/messages/unread')).unread); }catch(e){} }
async function startStream(){
  if(!AUTH||SOC.abort) return;
  const ac=new AbortController(); SOC.abort=ac;
  try{
    const res=await fetch(API_BASE+'/api/messages/stream',{headers:{Authorization:'Bearer '+AUTH.token},signal:ac.signal});
    if(!res.ok||!res.body) throw new Error('stream');
    const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';
    for(;;){ const {done,value}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true});
      let i; while((i=buf.indexOf('\n\n'))>=0){ const fr=buf.slice(0,i); buf=buf.slice(i+2); const ev=/event: (\w+)/.exec(fr), da=/data: (.*)/.exec(fr); if(ev&&da){ try{ onStreamEvent(ev[1],JSON.parse(da[1])); }catch(_){} } } }
  }catch(e){}
  SOC.abort=null; if(AUTH&&!ac.signal.aborted) setTimeout(startStream,3500);
}
function stopStream(){ if(SOC.abort){ try{ SOC.abort.abort(); }catch(e){} SOC.abort=null; } }
function onStreamEvent(ev,m){
  if(ev!=='message'||!AUTH) return;
  const incoming=m.recipient_id===AUTH.user.id, peerId=incoming?m.sender_id:m.recipient_id;
  SOC.convs=null;
  if(S.view==='messages'&&SOC.peer&&SOC.peer.id===peerId){
    if(!SOC.thread.some(x=>x.id===m.id)){ SOC.thread.push(m); renderChatPane(); }
    if(incoming) api('/api/messages/with/'+peerId).catch(()=>{});
    loadConvs(true);
  }else if(incoming){ setUnread(SOC.unread+1); toast('Yeni mesajın var.'); if(S.view==='messages') loadConvs(true); }
}
async function loadConvs(keep){
  try{ SOC.convs=(await api('/api/messages/conversations')).items; }catch(e){ SOC.convs=[]; }
  if(S.view==='messages'){ const el=document.getElementById('convList'); if(el) el.innerHTML=convListHtml(); else if(!keep) render(); }
}
function convListHtml(){
  if(SOC.convs===null) return '<div class="skeleton" style="height:60px"></div>';
  return SOC.convs.length?SOC.convs.map(c=>`<div class="conv ${SOC.peer&&SOC.peer.id===c.user_id?'on':''}" onclick="openChat('${c.user_id}')"><div class="avatar sm">${initial(c.company_name||c.name)}</div><div class="pinfo"><b>${esc(c.company_name||c.name)}</b><span>${c.mine?'Sen: ':''}${esc(c.body.slice(0,46))}</span></div>${c.unread?`<span class="ubadge">${c.unread}</span>`:''}</div>`).join(''):'<p style="padding:14px;font-size:14px">Henüz mesajın yok. Bir profilden ya da üründen “Mesaj gönder”e bas.</p>';
}
async function openChat(userId,productId){
  if(needLogin('Mesaj göndermek için giriş yap.')) return;
  if(isMe(userId)) return toast('Kendine mesaj gönderemezsin.');
  SOC.chatProduct=productId||null; SOC.thread=[]; SOC.peer=null;
  if(S.view!=='messages') setView('messages');
  try{
    const d=await api('/api/messages/with/'+userId); SOC.peer=d.peer; SOC.thread=d.items;
    if(productId&&PRODUCT_STATE&&!SOC.thread.length) SOC.draft=`Merhaba, “${PRODUCT_STATE.title||PRODUCT_STATE.ai_object_type||'ürün'}” ile ilgileniyorum.`;
    refreshUnread(); loadConvs(true); render();
    const inp=document.getElementById('chatInput'); if(inp){ inp.value=SOC.draft||''; SOC.draft=''; inp.focus(); }
  }catch(e){ toast(e.message); }
}

function chatPaneHtml(){
  if(!SOC.peer) return '<div class="chat-empty">Bir sohbet seç ya da bir profilden “Mesaj gönder”e bas.</div>';
  const me=AUTH.user.id;
  return `<div class="chat-head" onclick="openUser('${esc(SOC.peer.handle)}')"><div class="avatar sm">${initial(SOC.peer.company_name||SOC.peer.name)}</div><b>${esc(SOC.peer.company_name||SOC.peer.name)}</b><span>@${esc(SOC.peer.handle)}</span></div>
    <div class="chat-body" id="chatBody">${SOC.thread.map(m=>`<div class="bub ${m.sender_id===me?'me':''}">${m.product_title?`<div class="bub-p" onclick="openProduct('${m.analysis_id}')">📎 ${esc(m.product_title)}</div>`:''}${esc(m.body)}<small>${new Date(m.created_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')||'<div class="chat-empty">Sohbeti başlat.</div>'}</div>
    <div class="chat-input"><input type="text" id="chatInput" maxlength="2000" placeholder="Mesaj yaz…" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn-lg primary" style="padding:10px 20px;font-size:14px" onclick="sendMsg()">Gönder</button></div>`;
}
function renderChatPane(){
  const el=document.getElementById('chatPane'); if(!el) return;
  const keep=(document.getElementById('chatInput')||{}).value||'';
  el.innerHTML=chatPaneHtml(); const inp=document.getElementById('chatInput'); if(inp) inp.value=keep;
  const b=document.getElementById('chatBody'); if(b) b.scrollTop=b.scrollHeight;
}
async function sendMsg(){
  const inp=document.getElementById('chatInput'); if(!inp||!SOC.peer) return; const body=inp.value.trim(); if(!body) return;
  inp.value='';
  try{ const d=await api('/api/messages',{method:'POST',body:{toUserId:SOC.peer.id,body,analysisId:SOC.chatProduct||undefined}}); SOC.chatProduct=null;
    if(!SOC.thread.some(x=>x.id===d.message.id)) SOC.thread.push(d.message); renderChatPane(); loadConvs(true); }
  catch(e){ inp.value=body; toast(e.message); }
}
window.sendMsg=sendMsg;
function renderMessages(){
  if(!AUTH) return `<div class="light-page"><section class="m-body"><div class="wrap"><div class="empty">Mesajlarını görmek için giriş yap.<br><button class="btn-lg primary" onclick="openAuthModal('login')">Giriş Yap</button></div></div></section></div>`;
  if(SOC.convs===null) loadConvs();
  requestAnimationFrame(()=>{ renderChatPane(); });
  return `<div class="light-page"><section class="m-body"><div class="wrap-wide">
    <div class="p-head rv in"><div><h2 style="font-size:36px;">Mesajlar</h2><p>Satıcılarla ve arkadaşlarınla anlık yazış.</p></div></div>
    <div class="chat-wrap"><div class="chat-side" id="convList">${convListHtml()}</div><div class="chat-main" id="chatPane"></div></div>
  </div></section></div>`;
}

/* ---- Profil düzenleme alanı (telefon, kullanıcı adı, biyografi, şirket) ---- */
function profileEditHtml(){
  const m=PROFILE_ME||{};
  return `<div class="m-title"><h3>Herkese açık profilim</h3><span>${m.handle?`<a style="color:var(--blue);cursor:pointer" onclick="openUser('${esc(m.handle)}')">Profilimi gör</a>`:''}</span></div>
  <div class="d-card" style="max-width:640px;margin-bottom:50px">
    <div class="field" style="margin-top:0"><label>Kullanıcı adı</label><input type="text" id="peHandle" maxlength="24" value="${esc(m.handle||'')}"></div>
    <div class="field"><label>İsim</label><input type="text" id="peName" maxlength="80" value="${esc(m.name||'')}"></div>
    ${m.accountType==='company'?`<div class="field"><label>Şirket adı</label><input type="text" id="peCompany" maxlength="80" value="${esc(m.companyName||'')}"></div>`:''}
    <div class="field"><label>Biyografi</label><textarea id="peBio" rows="3" maxlength="300">${esc(m.bio||'')}</textarea></div>
    <div class="field"><label>Telefon</label><input type="tel" id="pePhone" autocomplete="tel" value="${esc(m.phone||'')}" placeholder="0532 123 45 67"></div>
    <label class="chk"><input type="checkbox" id="peFind" ${m.findByPhone!==false?'checked':''}><span>Rehberinde numaram olan arkadaşlarım beni ColorDetect’te bulabilsin.</span></label>
    <button class="btn-lg primary" style="padding:10px 22px;font-size:14px;margin-top:16px" onclick="saveProfileEdit()">Kaydet</button>
  </div>`;
}
async function saveProfileEdit(){
  const body={handle:document.getElementById('peHandle').value.trim(),name:document.getElementById('peName').value.trim(),bio:document.getElementById('peBio').value,findByPhone:document.getElementById('peFind').checked};
  const ph=document.getElementById('pePhone').value.trim(); if(ph) body.phone=ph;
  const co=document.getElementById('peCompany'); if(co) body.companyName=co.value;
  try{ const d=await api('/api/me/profile',{method:'PATCH',body}); AUTH.user=Object.assign(AUTH.user,{name:d.user.name,handle:d.user.handle,phone:d.user.phone,needsPhone:!d.user.phone}); setAuth(AUTH); PROFILE_ME=null; toast('Profilin güncellendi.'); render(); }
  catch(e){ toast(e.message); }
}
window.saveProfileEdit=saveProfileEdit;

/* ---- Telefon isteme (Google ile girenler / eski hesaplar) ---- */
async function submitPhone(){
  const phone=document.getElementById('phoneInput').value.trim(); if(!phone) return showAuthError('Telefon numaranı yaz.');
  setAuthLoading(true);
  try{ const d=await api('/api/me/profile',{method:'PATCH',body:{phone,findByPhone:document.getElementById('phoneFind').checked}}); AUTH.user.phone=d.user.phone; AUTH.user.needsPhone=false; setAuth(AUTH); closeModal(); toast('Telefon numaran kaydedildi.'); }
  catch(e){ setAuthLoading(false,'Kaydet'); showAuthError(e.message); }
}
window.submitPhone=submitPhone;
async function bootSocial(){
  if(!AUTH) return;
  try{ const me=await api('/api/auth/me'); AUTH.user=Object.assign(AUTH.user||{},me.user); setAuth(AUTH); if(me.user.needsPhone) openAuthModal('phone'); }catch(e){ return; }
  refreshUnread(); startStream();
}

/* ============ ROOT ============ */
function render(){
  cleanup3D(); STAGE=null;
  renderNav();
  const app=document.getElementById('app');
  let html='';
  if(S.view==='home') html=renderHome();
  else if(S.view==='analyze') html=renderAnalyze();
  else if(S.view==='market') html=renderMarket();
  else if(S.view==='detail') html=renderDetail();
  else if(S.view==='profile') html=renderProfile();
  else if(S.view==='legal') html=renderLegal();
  else if(S.view==='people') html=renderPeople();
  else if(S.view==='user') html=renderUser();
  else if(S.view==='boards') html=renderBoards();
  else if(S.view==='board') html=renderBoard();
  else if(S.view==='messages') html=renderMessages();
  app.innerHTML=html+`<footer><div class="wrap"><span>© ColorDetect — renk psikolojisine dayalı analiz ve paylaşım platformu.</span><span style="display:flex;gap:14px;flex-wrap:wrap"><a onclick="openLegal('aydinlatma')">KVKK</a><a onclick="openLegal('gizlilik')">Gizlilik</a><a onclick="openLegal('cerez')">Çerezler</a><a onclick="openLegal('sartlar')">Şartlar</a><a onclick="openLegal('haklar')">Haklarınız</a></span></div></footer>`;
  observeReveals();
  requestAnimationFrame(()=>{
    if(S.view==='home'){ const h=document.getElementById('hero3d'); if(h) mountHero(h); selectHue(4); }
    else if(S.view==='analyze') mountStage();
    else if(S.view==='detail') mountDetailStage();
  });
}
fetch(API_BASE+'/api/auth/config').then(r=>r.json()).then(c=>{ CONFIG=c||CONFIG; loadGoogle(); }).catch(()=>{});
render();
bootSocial();
try{
  const rt=new URLSearchParams(location.search).get('reset');
  if(rt){ RESET_TOKEN=rt; authTab='reset'; document.getElementById('modalRoot').innerHTML=renderAuthModal(); }
}catch(e){}
</script>
</body>
</html>
