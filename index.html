<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f2">
<title>ColorDetect — Renk Psikolojisi Motoru</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff'/%3E%3Cpath d='M47.32 19.14A20 20 0 1 0 47.32 44.86' fill='none' stroke='%23111' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='32' r='4.6' fill='%23111'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#fff; --bg2:#f5f5f7; --ink:#1d1d1f; --ink2:#6e6e73; --line:#d2d2d7; --line2:#e8e8ed;
    --blue:#0071e3; --blue-d:#0062c4; --violet:#5e5ce6; --coral:#ff6f59;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg2);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.03em;}
  p{margin:0;color:var(--ink2);line-height:1.5;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit;}
  ::selection{background:rgba(94,92,230,.25);}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  .wrap-wide{max-width:1280px;margin:0 auto;padding:0 24px;}
  .eyebrow{font-size:14px;font-weight:600;color:var(--coral);letter-spacing:.01em;margin-bottom:12px;}
  .dark .eyebrow{color:#ff9f7a;}
  .big{font-size:clamp(40px,7vw,88px);line-height:1.04;letter-spacing:-.04em;}
  .mid{font-size:clamp(30px,4.6vw,56px);line-height:1.07;letter-spacing:-.035em;}
  .grad-text{background:linear-gradient(95deg,#7d7aff 0%,#ff6f59 52%,#ffd166 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}

  /* ---------- background layers ---------- */
  .aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 22s ease-in-out infinite;}
  .aurora i:nth-child(1){width:52vw;height:52vw;left:-14vw;top:-18vw;background:#5e5ce6;}
  .aurora i:nth-child(2){width:44vw;height:44vw;right:-12vw;top:4vw;background:#ff375f;animation-delay:-6s;opacity:.38;}
  .aurora i:nth-child(3){width:50vw;height:50vw;left:22vw;bottom:-26vw;background:#30d5c8;animation-delay:-11s;opacity:.32;}
  .aurora i:nth-child(4){width:30vw;height:30vw;right:14vw;bottom:-6vw;background:#ff9f0a;animation-delay:-3s;opacity:.28;}
  @keyframes drift{50%{transform:translate(5vw,3vw) scale(1.14);}}
  .dots::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.14) 1px,transparent 1px);background-size:26px 26px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 0%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 40%,#000 0%,transparent 72%);pointer-events:none;}
  .dark.dots::before{background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1px);}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");}

  /* ---------- NAV ---------- */
  .nav{position:sticky;top:0;z-index:100;height:48px;background:rgba(251,248,242,.86);border-bottom:1px solid rgba(0,0,0,.06);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);}
  .nav-inner{max-width:1080px;margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .logo{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;color:#111;cursor:pointer;letter-spacing:-.01em;}
  .logo .mark{width:12px;height:12px;border-radius:50%;background:conic-gradient(from 200deg,#5e5ce6,#ff375f,#ffd60a,#30d158,#5e5ce6);}
  .nav-links{display:flex;gap:30px;font-size:12px;}
  .nav-links a{color:rgba(17,17,17,.62);transition:color .2s;cursor:pointer;}
  .nav-links a:hover,.nav-links a.active{color:#000;}
  .nav-right{display:flex;align-items:center;gap:6px;}
  .pill-btn{padding:6px 14px;border-radius:980px;font-size:12px;font-weight:500;transition:.2s;color:rgba(17,17,17,.8);}
  .pill-btn:hover{color:#000;}
  .pill-btn.solid{background:#111;color:#fff;}
  .pill-btn.solid:hover{background:#333;}

  .umenu{position:relative}.uavatar{width:32px;height:32px;border-radius:50%;border:0;background:linear-gradient(135deg,#6e8cff,#c06cff);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
  .udrop{display:none;position:absolute;right:0;top:40px;min-width:210px;background:#fff;color:#1d1d1f;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);padding:6px;z-index:90}[dir=rtl] .udrop{right:auto;left:0}
  .udrop.open{display:block}.udrop a{display:block;padding:9px 12px;border-radius:9px;font-size:14px;cursor:pointer}.udrop a:hover{background:#f2f2f4}.udrop a.danger{color:#d70015}
  .udrop .uname{padding:8px 12px 10px;font-weight:600;font-size:14px;border-bottom:1px solid #eee;margin-bottom:4px}.udrop .uname small{display:block;font-weight:400;color:#86868b;font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
  .pwwrap{position:relative}.pwwrap input{width:100%;padding-right:64px}.pwtog{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:#0071e3;cursor:pointer;user-select:none}
  .srcrow{display:flex;gap:8px;margin-top:10px}.srcrow button{flex:1;padding:9px 8px;border-radius:12px;border:1px solid rgba(128,128,128,.35);background:rgba(128,128,128,.1);color:inherit;font:inherit;font-size:13px;cursor:pointer}
  .extras{display:flex;gap:8px;flex-wrap:wrap}.xth{position:relative;width:92px;border-radius:12px;border:2px solid transparent;background:rgba(128,128,128,.12);padding:3px;display:flex;flex-direction:column;gap:3px;color:inherit;cursor:pointer}
  .xth.on{border-color:#6e8cff}.xth img{width:100%;height:58px;object-fit:cover;border-radius:8px;display:block}.xth span{font-size:11px;text-align:center}
  .xth select{width:100%;font-size:11px;padding:2px 0;text-overflow:clip;border-radius:6px;background:rgba(0,0,0,.25);color:inherit;border:0}.xth b{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#444;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
  .xadd{width:78px;min-height:84px;border-radius:12px;border:1px dashed rgba(128,128,128,.5);background:transparent;color:inherit;font-size:12px;cursor:pointer}
  .dbox{margin-top:12px;padding:12px;border-radius:14px;border:1px solid rgba(128,128,128,.3);background:rgba(128,128,128,.08);font-size:13px;line-height:1.45}
  .dbox .ds{display:flex;gap:8px;align-items:flex-start}.dbox small{opacity:.75}
  .dbox textarea{width:100%;margin-top:8px;font-size:13px;padding:9px 10px;border-radius:10px;resize:vertical}
  .dbox .brow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.dbox .brow button{flex:1;min-width:110px;padding:9px 10px;border-radius:10px;border:1px solid rgba(128,128,128,.35);background:rgba(128,128,128,.12);color:inherit;font:inherit;font-size:13px;cursor:pointer}
  .dbox .brow button:disabled{opacity:.45;cursor:default}.dbox .brow button.pri{background:#0a84ff;border-color:#0a84ff;color:#fff}
  .mseg{display:inline-flex;border-radius:999px;background:rgba(128,128,128,.22);padding:3px;gap:2px}.mseg button{border:0;background:transparent;color:inherit;font:inherit;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer}.mseg button.on{background:#fff;color:#111}
  .mk-wrap{position:relative;touch-action:none;margin:10px 0;border-radius:12px;overflow:hidden;background:#222}.mk-wrap canvas{display:block;width:100%;height:auto;cursor:crosshair}
  .dimrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dimrow input{width:100%;padding:10px 8px;font-size:13px}
  .ins{margin-top:20px}.ins h4{font-size:15px;margin:20px 0 8px;letter-spacing:.01em}.whylist{margin:0;padding-left:18px;font-size:14px;line-height:1.55}.whylist li{margin-bottom:6px}
  .insc{border:1px solid rgba(128,128,128,.28);background:rgba(128,128,128,.07);border-radius:14px;padding:12px 14px;margin-bottom:10px}.insc p{margin:6px 0 0;font-size:14px;line-height:1.5}.insc small{display:block;margin-top:6px;opacity:.7;font-size:12px}
  .inh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.inh b{font-size:14.5px}
  .evid{flex:none;font-size:11px;padding:3px 9px;border-radius:980px;border:1px solid currentColor;white-space:nowrap}.evid.strong{color:#2fb35c}.evid.moderate{color:#d9962b}.evid.limited{color:#8e8e93}
  .caveat{font-size:12.5px;opacity:.7;margin-top:14px}.swatch .shade{font-size:12.5px;opacity:.8;margin-top:5px;line-height:1.45}.swatch .name em{font-style:normal;font-size:11px;opacity:.6;margin-left:6px}
  .refine-box{margin-top:26px;padding:16px;border-radius:16px;border:1px solid rgba(128,128,128,.3);background:rgba(128,128,128,.07)}.refine-box h4{margin:0 0 4px;font-size:16px}.refine-box p{margin:0 0 10px;font-size:13.5px;opacity:.8}.refine-box textarea{width:100%}
  .priv-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.priv{font-size:13px;padding:6px 12px;border-radius:980px;background:rgba(128,128,128,.14)}.priv.pub{background:rgba(47,179,92,.18);color:#2fb35c}
  .filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.fthumb{display:flex;flex-direction:column;gap:5px;font-size:12px}.fthumb img{width:100%;height:110px;object-fit:cover;border-radius:12px;background:rgba(128,128,128,.15)}.fthumb a{color:#0071e3;cursor:pointer}
  .lang-sel{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid rgba(128,128,128,.35);color:inherit;border-radius:980px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;max-width:96px}
  [dir=rtl] .nav-links{direction:rtl}
  .colchips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .colchips button{display:flex;align-items:center;gap:6px;padding:4px;border-radius:980px;border:2px solid transparent;font-size:11px;color:#f5f5f7;background:rgba(255,255,255,.08);}
  .colchips button i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);}
  .colchips button:has(i)+button{}
  .colchips button[data-h=""]{padding-right:10px;}
  .colchips button.on{border-color:#fff;}
  .moodchips{display:flex;flex-wrap:wrap;gap:6px;}
  .moodchips button{padding:6px 12px;border-radius:980px;font-size:12px;color:#d1d1d6;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);transition:.2s;}
  .moodchips button.on{background:#fff;color:#111;border-color:#fff;}
  #moodText{width:100%;resize:vertical;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#f5f5f7;font:13px/1.4 var(--font);}
  #moodText::placeholder{color:#8e8e93;}
  .tips{margin-top:16px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.07);font-size:14px;line-height:1.5;color:#d1d1d6;}
  .tips ul{margin:6px 0 0 18px;padding:0;} .tips b{color:#fff;}
  .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .price{position:absolute;right:14px;bottom:12px;font-size:14px;font-weight:600;padding:6px 12px;border-radius:980px;background:rgba(255,255,255,.92);color:#111;}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px;}
  .dcard{border-radius:24px;padding:22px;}
  .dcard b{display:block;font-size:30px;letter-spacing:-.03em;} .dcard span{font-size:13px;color:var(--ink2);}
  .dcard.wide{grid-column:1/-1;}
  .dtable{width:100%;border-collapse:collapse;font-size:14px;} .dtable th{text-align:left;font-weight:500;color:var(--ink2);font-size:12px;padding:8px 10px;} .dtable td{padding:11px 10px;border-top:1px solid rgba(120,90,50,.1);vertical-align:middle;}
  .st{font-size:11.5px;padding:3px 10px;border-radius:980px;background:#eee;} .st.paid{background:#dff5e6;color:#17713a;} .st.pending_payment{background:#fff0d6;color:#8a5a00;} .st.shipped{background:#dde9ff;color:#1b4fa3;} .st.cancelled{background:#fde0dc;color:#a23a2a;}
  .lrow{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid rgba(120,90,50,.1);flex-wrap:wrap;}
  .lrow .th{width:64px;height:64px;border-radius:14px;overflow:hidden;position:relative;flex:none;}
  .lrow .info{flex:1;min-width:160px;} .lrow .info b{display:block;font-size:15px;} .lrow .info small{color:var(--ink2);font-size:12.5px;}
  .minibtn{padding:8px 14px;border-radius:980px;font-size:13px;border:1px solid var(--line);background:#fff;} .minibtn:hover{border-color:#111;}
  .minibtn.dark{background:#111;color:#fff;border-color:#111;}
  .note{padding:14px 16px;border-radius:16px;background:#fff7e6;border:1px solid #f1deb0;color:#6b4b00;font-size:13.5px;line-height:1.5;margin-bottom:20px;}
  .legal{max-width:820px;margin:0 auto;padding:46px 0 90px;} .legal h1{font-size:40px;margin-bottom:6px;} .legal h3{font-size:19px;margin:28px 0 8px;} .legal p,.legal li{font-size:15px;line-height:1.65;color:#3c3c43;} .legal ul{padding-left:20px;margin:8px 0;}
  .legal .ph{background:#fff1b8;padding:1px 5px;border-radius:4px;}
  .ltabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px;} .ltabs button{padding:8px 16px;border-radius:980px;font-size:13px;background:rgba(255,255,255,.7);border:1px solid rgba(120,90,50,.14);} .ltabs button.on{background:#111;color:#fff;}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--ink2);margin-top:12px;} .chk input{margin-top:2px;flex:none;width:auto;} .chk a{color:var(--blue);cursor:pointer;text-decoration:underline;}
  .buybox{margin-top:20px;padding:18px;border-radius:20px;background:#fff;border:1px solid rgba(120,90,50,.12);} .buybox .p{font-size:30px;font-weight:700;letter-spacing:-.03em;}
  footer a{cursor:pointer;} footer a:hover{color:#111;}
  .light-v .colchips button{color:#f5f5f7;}
  .field textarea,.field input[type=number]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);font:15px var(--font);background:#fff;}
  /* ---------- buttons ---------- */
  .btn-lg{padding:13px 26px;border-radius:980px;font-size:16px;font-weight:500;transition:.25s var(--ease);display:inline-block;}
  .btn-lg.primary{background:var(--blue);color:#fff;}
  .btn-lg.primary:hover{background:var(--blue-d);transform:scale(1.03);}
  .btn-lg.secondary{background:transparent;color:var(--blue);border:1px solid var(--blue);}
  .btn-lg.secondary:hover{background:var(--blue);color:#fff;}
  .dark .btn-lg.secondary{color:#2997ff;border-color:#2997ff;}
  .dark .btn-lg.secondary:hover{background:#2997ff;color:#fff;}
  .link-arrow{color:var(--blue);font-size:17px;cursor:pointer;}
  .link-arrow:hover{text-decoration:underline;}
  .dark .link-arrow{color:#2997ff;}

  /* ---------- reveal ---------- */
  .rv{opacity:0;transform:translateY(40px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease);}
  .rv.in{opacity:1;transform:none;}
  .rv.d1{transition-delay:.08s;}.rv.d2{transition-delay:.16s;}.rv.d3{transition-delay:.24s;}.rv.d4{transition-delay:.32s;}
  @media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none;}.aurora i{animation:none;}}

  /* ---------- sections ---------- */
  section{position:relative;}
  .sec{padding:120px 0;}
  .dark{background:#000;color:#f5f5f7;}
  .dark p{color:#a1a1a6;}
  .light{background:var(--bg2);}
  .white{background:#fff;}
  .section-head{text-align:center;max-width:760px;margin:0 auto 64px;position:relative;z-index:1;}
  .section-head p{font-size:21px;margin-top:18px;line-height:1.4;}

  /* HERO */
  .hero{position:relative;min-height:calc(100vh - 48px);min-height:calc(100svh - 48px);display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;background:#000;color:#f5f5f7;}
  .hero3d{position:absolute;inset:0;z-index:1;}
  .hero3d canvas{display:block;width:100%;height:100%;}
  .hero-content{position:relative;z-index:2;max-width:900px;padding:0 24px;pointer-events:none;}
  .hero-content .btn-lg,.hero-content a{pointer-events:auto;}
  .hero .pre{font-size:19px;font-weight:600;color:#ff9f7a;margin-bottom:18px;}
  .hero p.sub{font-size:clamp(18px,2.2vw,24px);color:#c7c7cc;margin:26px auto 0;max-width:620px;line-height:1.35;}
  .hero-cta{display:flex;gap:14px;justify-content:center;margin-top:38px;flex-wrap:wrap;}
  .scroll-hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:2;width:22px;height:36px;border:1.5px solid rgba(255,255,255,.35);border-radius:12px;}
  .scroll-hint::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:#fff;animation:scrollDot 1.8s ease-in-out infinite;}
  @keyframes scrollDot{0%{opacity:0;transform:translateY(0);}30%{opacity:1;}100%{opacity:0;transform:translateY(12px);}}

  /* marquee */
  .marquee{background:#000;overflow:hidden;padding:0 0 70px;position:relative;}
  .marquee-track{display:flex;gap:14px;width:max-content;animation:marq 60s linear infinite;}
  .chip-pal{display:flex;border-radius:18px;overflow:hidden;height:64px;width:230px;flex-shrink:0;box-shadow:0 12px 30px rgba(0,0,0,.4);}
  .chip-pal span{flex:1;}
  @keyframes marq{to{transform:translateX(-50%);}}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center;position:relative;z-index:1;}
  .stat b{display:block;font-size:clamp(48px,7vw,84px);font-weight:700;letter-spacing:-.045em;line-height:1;background:linear-gradient(180deg,#1d1d1f 30%,#86868b);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat span{display:block;margin-top:10px;font-size:17px;color:var(--ink2);}

  /* bento */
  .bento{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;position:relative;z-index:1;}
  .tile{border-radius:30px;padding:40px;position:relative;overflow:hidden;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.04);transition:transform .5s var(--ease);}
  .tile:hover{transform:scale(1.012);}
  .tile h3{font-size:clamp(24px,2.6vw,34px);line-height:1.1;margin-bottom:10px;position:relative;z-index:1;}
  .tile p{font-size:17px;position:relative;z-index:1;}
  .tile .num{position:absolute;top:30px;left:40px;font-family:var(--mono);font-size:13px;opacity:.6;z-index:1;}
  .t-a{grid-column:span 3;background:linear-gradient(150deg,#2a2a6e,#5e5ce6 60%,#8e8cff);color:#fff;}
  .t-b{grid-column:span 3;background:linear-gradient(150deg,#5c1d33,#ff375f 65%,#ff9f7a);color:#fff;}
  .t-c{grid-column:span 6;background:linear-gradient(120deg,#06302c,#0a8f84 60%,#6fe3c7);color:#fff;min-height:340px;}
  .t-a p,.t-b p,.t-c p{color:rgba(255,255,255,.82);}
  .tile .orbs{position:absolute;inset:0;pointer-events:none;}
  .tile .orbs i{position:absolute;border-radius:50%;filter:blur(2px);opacity:.9;}

  /* hue explorer */
  .hue-sec{transition:background .8s;overflow:hidden;--glow:#0a84ff;background:#000;}
  .hue-glow{position:absolute;left:50%;top:48%;width:min(900px,120vw);height:min(900px,120vw);transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,var(--glow) 0%,transparent 62%);opacity:.42;filter:blur(30px);transition:background .9s,opacity .9s;pointer-events:none;}
  .hue-dots{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:44px;position:relative;z-index:1;}
  .hue-dot{width:54px;height:54px;border-radius:50%;border:3px solid transparent;transition:.35s var(--ease);box-shadow:0 8px 22px rgba(0,0,0,.45);position:relative;}
  .hue-dot:hover{transform:scale(1.12);}
  .hue-dot.on{border-color:#fff;transform:scale(1.18);}
  .hue-card{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;max-width:980px;margin:0 auto;padding:44px;border-radius:34px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);}
  .hue-card h3{font-size:clamp(34px,5vw,56px);}
  .hue-card .lead{font-size:20px;color:#d2d2d7;margin-top:12px;line-height:1.35;}
  .meter{margin-bottom:18px;}
  .meter .row{display:flex;justify-content:space-between;font-size:13px;color:#a1a1a6;margin-bottom:7px;}
  .meter .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;}
  .meter .bar i{display:block;height:100%;width:0;border-radius:8px;background:var(--glow);transition:width 1s var(--ease),background .9s;}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
  .tag{font-size:12px;padding:6px 12px;border-radius:980px;background:rgba(0,113,227,.1);color:var(--blue-d);}
  .dark .tag,.glass .tag{background:rgba(255,255,255,.1);color:#e5e5ea;}
  .fine{font-size:12px;color:#86868b;text-align:center;margin-top:32px;position:relative;z-index:1;}

  /* age */
  .ages{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;position:relative;z-index:1;}
  .age{background:#fff;border-radius:26px;padding:22px 22px 26px;transition:transform .5s var(--ease),box-shadow .5s;}
  .age:hover{transform:translateY(-8px);box-shadow:0 30px 60px rgba(0,0,0,.1);}
  .age .sw{height:130px;border-radius:18px;margin-bottom:18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);}
  .age h4{font-size:19px;}
  .age .yr{font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin:4px 0 10px;}
  .age p{font-size:14px;}

  /* use-case grid */
  .uses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;position:relative;z-index:1;}
  .use{border-radius:26px;padding:30px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:.4s var(--ease);}
  .use:hover{background:rgba(255,255,255,.1);transform:translateY(-4px);}
  .use .dotrow{display:flex;margin-bottom:22px;}
  .use .dotrow i{width:26px;height:26px;border-radius:50%;margin-right:-8px;border:2px solid #111;}
  .use h4{font-size:21px;margin-bottom:6px;}
  .use p{font-size:15px;}

  .cta{text-align:center;overflow:hidden;}
  .cta .inner{position:relative;z-index:2;}

  /* ---------- forms ---------- */
  .field{margin-top:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--f2,var(--ink2));margin-bottom:7px;letter-spacing:.01em;}
  .field input[type=text],.field input[type=email],.field input[type=password],.field input[type=tel],.field select{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--fl,var(--line));background:var(--fb,#fff);font-size:15px;color:var(--f1,var(--ink));font-family:var(--font);
    appearance:none;-webkit-appearance:none;transition:border-color .2s, box-shadow .2s;}
  .field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a1a1a6' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:36px;}
  .field select option{color:#1d1d1f;background:#fff;}
  .field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.18);outline:none;}

  .glass{--f1:#f5f5f7;--f2:#a1a1a6;--fl:rgba(255,255,255,.16);--fb:rgba(255,255,255,.07);
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border-radius:30px;color:#f5f5f7;}
  .glass p{color:#a1a1a6;}

  .btn-analyze{width:100%;margin-top:22px;padding:15px;border-radius:14px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;transition:.25s var(--ease);}
  .btn-analyze:hover{background:var(--blue-d);transform:scale(1.015);}
  .btn-analyze:disabled{background:rgba(120,120,128,.35);color:rgba(255,255,255,.6);cursor:not-allowed;transform:none;}
  .btn-save{flex:1;padding:13px;border-radius:12px;background:#f5f5f7;color:#1d1d1f;font-size:14px;font-weight:600;transition:.2s;}
  .btn-save:hover{background:#fff;}
  .btn-save.secondary{background:transparent;border:1px solid rgba(255,255,255,.25);color:#f5f5f7;}
  .btn-save.secondary:hover{border-color:#fff;}
  .light-page .btn-save{background:var(--ink);color:#fff;}
  .light-page .btn-save:hover{background:#000;}
  .light-page .btn-save.secondary{border-color:var(--line);color:var(--ink);background:#fff;}

  /* ---------- ANALYZE / STUDIO ---------- */
  .studio-sec{background:#000;color:#f5f5f7;padding:64px 0 100px;overflow:hidden;min-height:calc(100vh - 48px);}
  .page-head{text-align:center;margin-bottom:46px;position:relative;z-index:1;}
  .page-head p{font-size:19px;margin-top:14px;color:#a1a1a6;}
  .studio{display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start;position:relative;z-index:1;}
  .panel{padding:28px;}
  .panel h3{font-size:17px;margin-bottom:4px;}
  .dropzone{border:1.5px dashed rgba(255,255,255,.25);border-radius:20px;padding:26px;text-align:center;cursor:pointer;transition:.25s var(--ease);margin-top:14px;}
  .dropzone:hover,.dropzone.over{border-color:#2997ff;background:rgba(41,151,255,.08);}
  .dropzone img{max-width:100%;max-height:170px;border-radius:12px;display:block;margin:0 auto;}
  .dropzone .big-ic{font-size:30px;margin-bottom:6px;}
  .dropzone b{font-size:15px;}
  .dropzone .hint{font-size:12.5px;color:#a1a1a6;margin-top:6px;}
  .viewer{position:relative;overflow:hidden;height:min(72vh,680px);min-height:460px;padding:0;
    background:radial-gradient(120% 90% at 50% 15%,rgba(255,255,255,.1),rgba(255,255,255,.02) 55%,transparent);}
  .stage3d{position:absolute;inset:0;touch-action:pan-y;cursor:grab;}
  .stage3d:active{cursor:grabbing;}
  .stage3d canvas{display:block;width:100%;height:100%;}
  .no3d{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#a1a1a6;font-size:14px;}
  .viewer-top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;z-index:3;pointer-events:none;gap:10px;flex-wrap:wrap;}
  .viewer-top>*{pointer-events:auto;}
  .seg{display:inline-flex;padding:3px;border-radius:12px;background:rgba(0,0,0,.45);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);}
  .seg button{padding:7px 16px;border-radius:9px;font-size:13px;font-weight:500;color:#a1a1a6;transition:.25s;}
  .seg button.on{background:rgba(255,255,255,.95);color:#1d1d1f;}
  .badge{font-size:12px;padding:7px 12px;border-radius:980px;background:rgba(0,0,0,.45);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);color:#d2d2d7;}
  .badge.ok{color:#30d158;}
  .viewer-bottom{position:absolute;left:18px;right:18px;bottom:18px;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none;flex-wrap:wrap;}
  .viewer-bottom>*{pointer-events:auto;}
  .pal-row{display:flex;gap:8px;padding:8px;border-radius:18px;background:rgba(0,0,0,.45);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);}
  .pal-row span{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);}
  .hint-mini{font-size:12px;color:#8e8e93;}
  .samples{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .sample-btn{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:980px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:12px;color:#e5e5ea;transition:.2s;}
  .sample-btn:hover{background:rgba(255,255,255,.14);}
  .sample-btn i{width:18px;height:18px;border-radius:50%;}

  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px;}
  .swatch{border-radius:18px;overflow:hidden;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);}
  .light-page .swatch{background:#fff;border-color:var(--line2);}
  .swatch .fill{height:78px;}
  .swatch .meta{padding:11px 12px 13px;}
  .swatch .hex{font-family:var(--mono);font-size:12px;}
  .swatch .name{font-size:12.5px;font-weight:600;margin-top:3px;}
  .swatch .mean{font-size:11.5px;color:#a1a1a6;margin-top:3px;line-height:1.35;}
  .light-page .swatch .mean{color:var(--ink2);}
  .ai-summary{margin-top:18px;padding:16px 18px;background:rgba(41,151,255,.12);border:1px solid rgba(41,151,255,.25);border-radius:16px;font-size:14px;color:#9ccfff;line-height:1.5;}
  .light-page .ai-summary{background:#eef5ff;border-color:#cfe3ff;color:#0a4a9c;}
  .ai-box{margin-top:18px;padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:13.5px;line-height:1.5;color:#d2d2d7;}
  .ai-box b{color:#fff;}
  .save-row{display:flex;gap:10px;margin-top:18px;}
  .result-wrap{margin-top:22px;position:relative;z-index:1;padding:28px;}

  /* ---------- MARKET ---------- */
  .light-page{background:linear-gradient(180deg,#f4ede1 0%,#f8f3ea 38%,#f3ece0 100%);position:relative;}
  .light-page::before{content:"";position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(60vw 40vw at 12% 8%,rgba(255,214,170,.38),transparent 70%),
    radial-gradient(50vw 40vw at 92% 30%,rgba(190,205,255,.34),transparent 70%),
    radial-gradient(55vw 40vw at 30% 85%,rgba(255,196,206,.28),transparent 70%);}
  .light-page>*{position:relative;}
  .m-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(180deg,transparent,#f4ede1);pointer-events:none;z-index:1;}
  .product-card,.d-card,.kpi,.dcard{background:rgba(255,255,255,.78);backdrop-filter:blur(14px);border:1px solid rgba(120,90,50,.09);box-shadow:0 1px 2px rgba(60,40,10,.04),0 12px 30px rgba(60,40,10,.05);}
  .product-card:hover{box-shadow:0 30px 56px rgba(60,40,10,.16);}
  .skeleton{background:linear-gradient(100deg,#ece4d6 30%,#f6f0e5 50%,#ece4d6 70%);background-size:300% 100%;}
  .m-hero{background:#000;color:#f5f5f7;padding:70px 0 64px;position:relative;overflow:hidden;text-align:center;}
  .m-hero p{color:#a1a1a6;font-size:19px;margin-top:14px;}
  .m-search{margin:34px auto 0;max-width:520px;position:relative;z-index:1;}
  .search{width:100%;padding:15px 22px;border-radius:980px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.09);backdrop-filter:blur(20px);font-size:16px;color:#fff;font-family:var(--font);}
  .search::placeholder{color:#8e8e93;}
  .search:focus{outline:none;border-color:#2997ff;box-shadow:0 0 0 4px rgba(41,151,255,.25);}
  .filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px;position:relative;z-index:1;}
  .fchip{padding:8px 16px;border-radius:980px;font-size:13px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);color:#d2d2d7;transition:.2s;}
  .fchip:hover{background:rgba(255,255,255,.16);}
  .fchip.on{background:#f5f5f7;color:#1d1d1f;border-color:#f5f5f7;}
  .m-body{padding:56px 0 100px;}
  .m-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px;gap:10px;flex-wrap:wrap;}
  .m-title h3{font-size:28px;}
  .m-title span{font-size:14px;color:var(--ink2);}
  .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;}
  .product-card{background:#fff;border-radius:26px;overflow:hidden;cursor:pointer;transition:transform .5s var(--ease),box-shadow .5s;}
  .product-card:hover{transform:translateY(-8px) scale(1.012);box-shadow:0 34px 60px rgba(0,0,0,.14);}
  .product-thumb{height:170px;position:relative;}
  .product-thumb .dotsr{position:absolute;left:16px;bottom:14px;display:flex;}
  .product-thumb .dotsr i{width:24px;height:24px;border-radius:50%;margin-right:-6px;border:2px solid rgba(255,255,255,.9);}
  .product-thumb .lbl{position:absolute;right:14px;top:14px;font-size:11px;padding:5px 10px;border-radius:980px;background:rgba(0,0,0,.4);color:#fff;backdrop-filter:blur(10px);}
  .product-body{padding:18px 20px 20px;}
  .product-body .who{font-size:12px;color:var(--ink2);margin-bottom:5px;}
  .product-body h3{font-size:18px;letter-spacing:-.02em;}
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 6px;}
  .meta-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);margin-top:8px;}
  .empty{text-align:center;padding:70px 20px;color:var(--ink2);grid-column:1/-1;}
  .empty .btn-lg{margin-top:20px;}
  .skeleton{height:300px;border-radius:26px;background:linear-gradient(100deg,#ececf0 30%,#f7f7fa 50%,#ececf0 70%);background-size:300% 100%;animation:shim 1.4s infinite;}
  @keyframes shim{from{background-position:100% 0;}to{background-position:0 0;}}

  /* ---------- DETAIL ---------- */
  .d-top{padding:44px 0 90px;}
  .back-link{font-size:15px;color:var(--blue);margin-bottom:22px;display:inline-block;cursor:pointer;}
  .back-link:hover{text-decoration:underline;}
  .detail-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:34px;align-items:start;}
  .viewer.light-v{background:#000;height:520px;}
  .like-btn{padding:11px 20px;border-radius:980px;border:1px solid var(--line);background:#fff;font-size:14px;transition:.2s;}
  .like-btn:hover{border-color:var(--ink);}
  .like-btn.liked{background:#fff0ee;border-color:#ff6f59;color:#c0442f;}
  .comment{padding:15px 0;border-bottom:1px solid var(--line2);}
  .comment .who{font-size:12.5px;font-weight:600;}
  .comment p{margin:4px 0 0;font-size:15px;color:var(--ink);}
  .comment-input{display:flex;gap:8px;margin-top:16px;}
  .comment-input input{flex:1;padding:12px 16px;border-radius:980px;border:1px solid var(--line);font-family:var(--font);font-size:15px;background:#fff;}
  .comment-input input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.15);}
  .d-card{background:#fff;border-radius:30px;padding:34px;}

  /* ---------- PROFILE ---------- */
  .p-head{display:flex;align-items:center;gap:20px;margin-bottom:34px;}
  .avatar{width:76px;height:76px;border-radius:50%;background:conic-gradient(from 200deg,#5e5ce6,#ff375f,#ffd60a,#30d158,#5e5ce6);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.3);}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:46px;}
  .kpi{background:#fff;border-radius:24px;padding:24px;}
  .kpi b{display:block;font-size:40px;letter-spacing:-.04em;}
  .kpi span{font-size:13.5px;color:var(--ink2);}

  /* ---------- modal / toast / fab / footer ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .3s;}
  @keyframes fade{from{opacity:0;}}
  .modal{background:#fff;border-radius:28px;padding:38px;max-width:420px;width:100%;position:relative;animation:pop .5s var(--ease);}
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(14px);}}
  .modal h2{font-size:26px;margin-bottom:4px;}
  .modal .sub{font-size:15px;margin-top:6px;}
  .modal-tabs{display:flex;gap:4px;margin-top:22px;background:#ececf0;padding:3px;border-radius:11px;}
  .modal-tab{flex:1;padding:9px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink2);transition:.2s;}
  .modal-tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12);}
  .modal-error{margin-top:14px;padding:11px 14px;background:#fff0ee;color:#c0442f;border-radius:12px;font-size:13.5px;}
  .modal-close{position:absolute;top:18px;right:20px;font-size:18px;color:var(--ink2);cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
  .modal-close:hover{background:#ececf0;}
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(29,29,31,.92);backdrop-filter:blur(14px);color:#fff;padding:13px 22px;border-radius:980px;font-size:14px;z-index:2000;opacity:0;transition:opacity .3s,transform .3s var(--ease);pointer-events:none;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-8px);}
  .loading-spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .fab{position:fixed;right:22px;bottom:22px;z-index:500;display:flex;align-items:center;gap:10px;padding:12px 20px 12px 14px;border-radius:980px;
    background:rgba(29,29,31,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:#fff;font-size:14px;font-weight:600;
    border:1px solid rgba(255,255,255,.16);box-shadow:0 14px 40px rgba(0,0,0,.35);transition:transform .3s var(--ease);}
  .fab:hover{transform:translateY(-3px) scale(1.03);}
  .fab .fab-dot{width:24px;height:24px;border-radius:50%;background:conic-gradient(from 90deg,#5e5ce6,#ff375f,#ffd60a,#30d158,#5e5ce6);animation:spin 6s linear infinite;flex-shrink:0;}
  footer{background:#f3ece0;padding:34px 0 46px;font-size:12px;color:#86868b;border-top:1px solid var(--line2);}
  footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;}

  @media(max-width:1000px){
    .studio{grid-template-columns:1fr;}
    .ages{grid-template-columns:repeat(2,1fr);}
    .uses{grid-template-columns:repeat(2,1fr);}
    .kpis{grid-template-columns:repeat(2,1fr);}
  }
  @media(max-width:820px){
    .nav-links{display:none;}
    .sec{padding:84px 0;}
    .stats{grid-template-columns:repeat(2,1fr);row-gap:40px;}
    .bento{grid-template-columns:1fr;}
    .t-a,.t-b,.t-c{grid-column:span 1;}
    .tile{padding:30px;min-height:250px;}
    .hue-card{grid-template-columns:1fr;padding:28px;gap:28px;}
    .detail-grid{grid-template-columns:1fr;}
    .viewer{min-height:420px;height:62vh;}
    .viewer.light-v{height:420px;}
  }
  @media(max-width:560px){
    .ages,.uses{grid-template-columns:1fr;}
    .fab span.fab-label{display:none;}
    .fab{padding:12px;}
    .hue-dot{width:46px;height:46px;}
  }
  /* sosyal ağ */
  .soc-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .soc-actions .btn-lg{padding:10px 18px;font-size:14px;}
  .plist{display:flex;flex-direction:column;gap:8px;}
  .person{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid var(--line2);cursor:pointer;transition:.2s;}
  .person:hover{background:#fff;box-shadow:0 6px 22px rgba(60,40,10,.08);}
  .pinfo{flex:1;min-width:0;display:flex;flex-direction:column;}
  .pinfo b{font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pinfo span{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .avatar.sm{width:40px;height:40px;font-size:16px;flex:none;display:inline-flex;align-items:center;justify-content:center;}
  .avatar.big{width:104px;height:104px;font-size:42px;display:flex;align-items:center;justify-content:center;flex:none;}

const _LW="A-Za-z0-9_ÇĞİÖŞÜçğıöşü";
const _RXH=/@[\w.]+/g, _RXN=new RegExp("(^|[^"+_LW+"{])(\\d+(?:[.,]\\d+)?)(?![" +_LW+"}])","g");
function tok(s){ const v=[]; let k=s.replace(_RXH,m=>{ v.push(m); return '{'+(v.length-1)+'}'; }); k=k.replace(_RXN,(m,p,n)=>{ v.push(n); return p+'{'+(v.length-1)+'}'; }); return [k,v]; }
function untok(o,v){ return o.replace(/\{(\d+)\}/g,(_,i)=>v[i]!==undefined?v[i]:''); }
const TC={}; function tcLoad(l){ try{ TC[l]=JSON.parse(localStorage.getItem('cd_tc_'+l)||'{}'); }catch(e){ TC[l]={}; } }
function _look(k){ const h=I18N[LANG], c=TC[LANG]; if(h&&h[k]!==undefined) return h[k]; if(c&&c[k]!==undefined) return c[k]; if(I18N.en&&I18N.en[k]!==undefined) return I18N.en[k]; if(TC.en&&TC.en[k]!==undefined) return TC.en[k]; return undefined; }
function t(s){
  if(LANG==='tr'||typeof s!=='string') return s;
  const k=s.trim(); if(!k) return s;
  let r=_look(k);
  if(r===undefined){ const [kk,v]=tok(k); if(kk!==k){ r=_look(kk); if(r!==undefined) r=untok(r,v); } }
  if(r===undefined){ for(const [rx,rep] of I18N_RX){ if(rx.test(k)){ r=k.replace(rx,rep[LANG]||rep.en); break; } } }
  if(r===undefined) return s;
  return s.replace(k,()=>r);
}
const _tried={};
async function ensureTranslations(){
  if(LANG==='tr') return; const myLang=LANG; if(!TC[myLang]) tcLoad(myLang); if(!_tried[myLang]) _tried[myLang]=new Set();
  const have=k=>(I18N[myLang]&&I18N[myLang][k]!==undefined)||TC[myLang][k]!==undefined||_tried[myLang].has(k);
  const miss=I18N_REG.filter(k=>!have(k));
  for(let i=0;i<miss.length;i+=70){
    if(LANG!==myLang) return; const part=miss.slice(i,i+70); part.forEach(k=>_tried[myLang].add(k));
    try{ const r=await fetch(API_BASE+'/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:myLang,strings:part})});
      if(!r.ok){ part.forEach(k=>_tried[myLang].delete(k)); break; }
      const {map}=await r.json(); Object.assign(TC[myLang],map);
      try{ localStorage.setItem('cd_tc_'+myLang,JSON.stringify(TC[myLang])); }catch(e){}
      if(LANG===myLang) applyLang(); }catch(e){ part.forEach(k=>_tried[myLang].delete(k)); break; }
  }
}
const _orig=new WeakMap(), _origAttr=new WeakMap(); let _busy=false;
function _tNode(n){
  if(n.nodeType===3){ const p=n.parentElement; if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.tagName)) return; if(S.view==='legal'&&p.closest('#app')) return;
    if(!_orig.has(n)||(_orig.get(n).tr!==n.nodeValue&&_orig.get(n).out!==n.nodeValue)) _orig.set(n,{tr:n.nodeValue,out:n.nodeValue});
    const o=_orig.get(n), out=t(o.tr); if(out!==n.nodeValue){ o.out=out; n.nodeValue=out; } }
  else if(n.nodeType===1){
    ['placeholder','title','aria-label','alt'].forEach(a=>{ if(!n.hasAttribute||!n.hasAttribute(a)) return; let m=_origAttr.get(n); if(!m){ m={}; _origAttr.set(n,m); }
      if(!m[a]||(m[a].tr!==n.getAttribute(a)&&m[a].out!==n.getAttribute(a))) m[a]={tr:n.getAttribute(a),out:n.getAttribute(a)};
      const out=t(m[a].tr); if(out!==n.getAttribute(a)){ m[a].out=out; n.setAttribute(a,out); } });
    n.childNodes.forEach(_tNode); }
}
function applyLang(root){ _busy=true; try{ _tNode(root||document.body); }finally{ _busy=false; } }
let _mo=null;
function initI18n(){
  document.documentElement.lang=LANG; document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  if(_mo) _mo.disconnect();
  _mo=new MutationObserver(ms=>{ if(_busy) return; _busy=true; try{ ms.forEach(m=>{ if(m.type==='childList') m.addedNodes.forEach(_tNode); else if(m.type==='characterData') _tNode(m.target); else if(m.type==='attributes') _tNode(m.target); }); }finally{ _busy=false; } });
  _mo.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','title','aria-label','alt']});
  if(LANG!=='tr'&&!TC[LANG]) tcLoad(LANG);
  applyLang(); ensureTranslations();
}
function setLang(l){ if(!LANGS.some(x=>x[0]===l)) return; LANG=l; try{ localStorage.setItem('cd_lang',l); }catch(e){} document.documentElement.lang=l; document.documentElement.dir=l==='ar'?'rtl':'ltr'; if(l!=='tr'&&!TC[l]) tcLoad(l); render(); const mr=document.getElementById('modalRoot'); if(mr&&mr.innerHTML.trim()){ try{ mr.innerHTML=renderAuthModal(); }catch(e){} } applyLang(); ensureTranslations(); }

async function api(path, opts={}){
  const headers=Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(AUTH && AUTH.token) headers['Authorization']='Bearer '+AUTH.token;
  const res=await fetch(API_BASE+path,{...opts,headers,body:opts.body?JSON.stringify(opts.body):undefined});
  let data=null; try{ data=await res.json(); }catch(e){}
  if(!res.ok){ throw new Error((data&&data.error)||`Sunucu hatası (${res.status})`); }
  return data;
}

function setAuthLoading(loading,labelTxt){

function afterLogin(data){

}
function handleAuthResponse(data){
  if(data.needs2fa){ MFA_TOKEN=data.mfaToken; switchAuthTab('mfa'); setTimeout(()=>{ const c=document.getElementById('mfaCode'); if(c) c.focus(); },50); return; }
  afterLogin(data);
}
async function submitLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  if(!email||!password) return showAuthError('E-posta ve şifre gerekli.');
  setAuthLoading(true);
  try{ handleAuthResponse(await api('/api/auth/login',{method:'POST',body:{email,password}})); }
  catch(e){ setAuthLoading(false,'Giriş Yap'); showAuthError(e.message==='Failed to fetch'?'Sunucuya ulaşılamadı. Birkaç saniye bekleyip tekrar dene (sunucu uyanıyor olabilir).':e.message); }
}
window.submitLogin=submitLogin;
async function submitSignup(){
  const name=document.getElementById('signupName').value.trim();
  const email=document.getElementById('signupEmail').value.trim();
  const phone=document.getElementById('signupPhone').value.trim();
  const password=document.getElementById('signupPassword').value;
  const coEl=document.getElementById('signupCompany'), companyName=coEl?coEl.value.trim():'';

}

/* ============ SCROLL REVEAL + COUNTERS ============ */
let IO=null;
function observeReveals(){
  if(!IO && 'IntersectionObserver' in window){
    IO=new IntersectionObserver(es=>{
      es.forEach(e=>{
        if(e.isIntersecting){
          e.target.classList.add('in');
          if(e.target.dataset.count) countUp(e.target);
          IO.unobserve(e.target);
        }
      });
    },{threshold:.15,rootMargin:'0px 0px -6% 0px'});
  }
  document.querySelectorAll('.rv,[data-count]').forEach(el=>{ if(IO) IO.observe(el); else el.classList.add('in'); });
}
function countUp(el){
  const to=+el.dataset.count, t0=performance.now(), dur=1600;
  (function step(now){
    const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,4);
    el.textContent=Math.round(to*e);
    if(p<1) requestAnimationFrame(step);
  })(t0);
}

/* ============ 3D ENGINE ============ */
let CLEAN3D=[];
function cleanup3D(){ CLEAN3D.forEach(f=>{ try{f();}catch(e){} }); CLEAN3D=[]; }
function srgb(hex){ return new THREE.Color(hex).convertSRGBToLinear(); }
function can3D(){
  if(typeof THREE==='undefined') return false;
  try{ const c=document.createElement('canvas'); return !!(c.getContext('webgl2')||c.getContext('webgl')); }catch(e){ return false; }
}
function no3dMsg(el){ el.innerHTML='<div class="no3d">3D önizleme bu tarayıcıda ya da bağlantıda açılamadı.<br>Sayfayı yenilemeyi dene.</div>'; }

function rbox(w,h,d,r,mat){
  r=Math.min(r,w/2-.001,h/2-.001,d/2-.001);
  const sh=new THREE.Shape(), x=(w-2*r)/2, y=(h-2*r)/2;
  sh.moveTo(-x,-y); sh.lineTo(x,-y); sh.lineTo(x,y); sh.lineTo(-x,y); sh.lineTo(-x,-y);
  const g=new THREE.ExtrudeGeometry(sh,{depth:Math.max(.001,d-2*r),bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:5,curveSegments:1});
  g.center();
  const m=new THREE.Mesh(g,mat); m.castShadow=true; m.receiveShadow=true; return m;
}
function shadowed(m){ m.castShadow=true; m.receiveShadow=true; return m; }
function pad5(h){
  const a=(h||[]).filter(Boolean); if(!a.length) a.push('#cccccc');
  while(a.length<5) a.push(a[a.length-1]);
  return a;
}
function artTexture(hexes){
  const c=document.createElement('canvas'); c.width=512; c.height=360;
  const x=c.getContext('2d'), p=pad5(hexes);
  x.fillStyle='#f4f1ea'; x.fillRect(0,0,512,360);
  x.fillStyle=p[0]; x.fillRect(30,30,452,300);
  x.fillStyle=p[1]; x.beginPath(); x.arc(170,190,110,0,7); x.fill();
  x.fillStyle=p[3]; x.fillRect(250,70,200,220);
  x.fillStyle=p[4]; x.beginPath(); x.arc(350,170,66,0,7); x.fill();
  x.fillStyle=p[2]; x.fillRect(30,250,452,80);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
}

    setSlot('sofa',p[3],instant); setSlot('acc',p[4],instant); setSlot('accGloss',p[4],instant); setSlot('rug',p[4],instant);
    setSlot('p0',p[0],instant); setSlot('p1',p[1],instant); setSlot('p2',p[2],instant); setSlot('p3',p[3],instant); setSlot('p4',p[4],instant);
  }

}

/* ============ FOTOĞRAF → 3D ÜRÜN ============ */
function _cutout(img,cut,maskImg){
  const maxS=420, sc=Math.min(1,maxS/Math.max(img.width,img.height));
  const w=Math.max(8,Math.round(img.width*sc)), h=Math.max(8,Math.round(img.height*sc));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0,w,h);
  const id=x.getImageData(0,0,w,h), d=id.data, N=w*h;
  let fg=new Uint8Array(N).fill(1), ok=false, bgSd=0;
  if(cut){
    if(maskImg){ const mc=document.createElement('canvas'); mc.width=w; mc.height=h; const mx2=mc.getContext('2d',{willReadFrequently:true}); mx2.drawImage(maskImg,0,0,w,h);
      const md=mx2.getImageData(0,0,w,h).data; for(let i=0;i<N;i++) fg[i]=md[i*4+3]>110?1:0; }
    else {
    // kenar piksellerinden arka plan rengi
    const edge=[]; for(let i=0;i<w;i++){ edge.push(i,(h-1)*w+i); } for(let j=0;j<h;j++){ edge.push(j*w,j*w+w-1); }
    let mr=0,mg=0,mb=0; edge.forEach(p=>{ mr+=d[p*4]; mg+=d[p*4+1]; mb+=d[p*4+2]; });
    mr/=edge.length; mg/=edge.length; mb/=edge.length;
    let v=0; edge.forEach(p=>{ v+=(d[p*4]-mr)**2+(d[p*4+1]-mg)**2+(d[p*4+2]-mb)**2; });
    const sd=Math.sqrt(v/edge.length/3); bgSd=sd; const T=Math.min(95,Math.max(34,sd*2.4+26));
    const isBg=p=>{ const dr=d[p*4]-mr,dg=d[p*4+1]-mg,db=d[p*4+2]-mb; return Math.sqrt(dr*dr+dg*dg+db*db)<T; };
    const bg=new Uint8Array(N), st=[];
    edge.forEach(p=>{ if(!bg[p]&&isBg(p)){ bg[p]=1; st.push(p); } });
    while(st.length){ const p=st.pop(), px=p%w, py=(p/w)|0;
      if(px>0){ const q=p-1; if(!bg[q]&&isBg(q)){ bg[q]=1; st.push(q);} }
      if(px<w-1){ const q=p+1; if(!bg[q]&&isBg(q)){ bg[q]=1; st.push(q);} }
      if(py>0){ const q=p-w; if(!bg[q]&&isBg(q)){ bg[q]=1; st.push(q);} }
      if(py<h-1){ const q=p+w; if(!bg[q]&&isBg(q)){ bg[q]=1; st.push(q);} } }
    for(let i=0;i<N;i++) fg[i]=bg[i]?0:1;
    }
    // en büyük bileşen
    const lab=new Int32Array(N); let best=0,bestL=0,L=0; const cnt=[0];
    for(let i=0;i<N;i++){ if(!fg[i]||lab[i]) continue; L++; let n=0; const s2=[i]; lab[i]=L;
      while(s2.length){ const p=s2.pop(); n++; const px=p%w;
        if(px>0&&fg[p-1]&&!lab[p-1]){lab[p-1]=L;s2.push(p-1);} if(px<w-1&&fg[p+1]&&!lab[p+1]){lab[p+1]=L;s2.push(p+1);}
        if(p>=w&&fg[p-w]&&!lab[p-w]){lab[p-w]=L;s2.push(p-w);} if(p<N-w&&fg[p+w]&&!lab[p+w]){lab[p+w]=L;s2.push(p+w);} }
      cnt.push(n); if(n>best){best=n;bestL=L;} }
    for(let i=0;i<N;i++) fg[i]=(lab[i]&&cnt[lab[i]]>=best*.18)?1:0;
    // ince yarıkları / parlak yansımaların oyuklarını kapat (kapama işlemi)
    const morph=(src,grow)=>{ const o=src.slice(); for(let j=0;j<h;j++) for(let i=0;i<w;i++){ const p=j*w+i;
      const n=[i>0?src[p-1]:(grow?0:1), i<w-1?src[p+1]:(grow?0:1), j>0?src[p-w]:(grow?0:1), j<h-1?src[p+w]:(grow?0:1)];
      if(grow){ if(!src[p]&&(n[0]||n[1]||n[2]||n[3])) o[p]=1; } else { if(src[p]&&(!n[0]||!n[1]||!n[2]||!n[3])) o[p]=0; } } return o; };
    for(let it=0;it<8;it++) fg=morph(fg,true);
    for(let it=0;it<8;it++) fg=morph(fg,false);
    // kapalı iç boşlukları doldur (kenara bağlı olmayan "arka plan" parçaları)
    { const out=new Uint8Array(N), s3=[]; const seed=p=>{ if(!fg[p]&&!out[p]){ out[p]=1; s3.push(p); } };
      for(let i=0;i<w;i++){ seed(i); seed((h-1)*w+i); } for(let j=0;j<h;j++){ seed(j*w); seed(j*w+w-1); }
      while(s3.length){ const p=s3.pop(), px=p%w; if(px>0) seed(p-1); if(px<w-1) seed(p+1); if(p>=w) seed(p-w); if(p<N-w) seed(p+w); }
      for(let i=0;i<N;i++) if(!fg[i]&&!out[i]) fg[i]=1; }
    // 2px erozyon (kenar halesi)
    for(let it=0;it<2;it++){ const f2=fg.slice(); for(let j=1;j<h-1;j++) for(let i=1;i<w-1;i++){ const p=j*w+i; if(fg[p]&&(!fg[p-1]||!fg[p+1]||!fg[p-w]||!fg[p+w])) f2[p]=0; } fg=f2; }
    let sum=0; for(let i=0;i<N;i++) sum+=fg[i]; const fr=sum/N; ok=fr>.06&&fr<.93;
  }
  if(!ok){ // yuvarlatılmış plaka
    const mx=w*.06,my=h*.06,r=Math.min(w,h)*.08;
    for(let j=0;j<h;j++) for(let i=0;i<w;i++){ let inside=i>=mx&&i<w-mx&&j>=my&&j<h-my;
      if(inside){ const cx=Math.min(Math.max(i,mx+r),w-mx-r), cy=Math.min(Math.max(j,my+r),h-my-r); inside=((i-cx)**2+(j-cy)**2)<=r*r; }
      fg[j*w+i]=inside?1:0; }
  }
  // kalınlık: her satırdaki gerçek genişliğe göre yuvarlak (eliptik) kesit
  const dep=new Float32Array(N), colD=new Float32Array(N), cap=Math.max(w,h)*.30;
  for(let j=0;j<h;j++){ let i=0; while(i<w){ if(!fg[j*w+i]){ i++; continue; } const st=i; while(i<w&&fg[j*w+i]) i++;
    const half=(i-st)/2, cx=(st+i-1)/2, a=Math.min(half*.95,cap);
    for(let k=st;k<i;k++){ const u=(k-cx)/Math.max(half,.5); dep[j*w+k]=a*Math.sqrt(Math.max(0,1-u*u)); } } }
  // üst/alt kenarlar da yuvarlansın (sütun bazlı sınır)
  for(let i=0;i<w;i++){ let j=0; while(j<h){ if(!fg[j*w+i]){ j++; continue; } const st=j; while(j<h&&fg[j*w+i]) j++;
    const half=(j-st)/2, cy=(st+j-1)/2;
    for(let k=st;k<j;k++){ const u=(k-cy)/Math.max(half,.5); colD[k*w+i]=Math.sqrt(Math.max(0,1-u*u)); } } }
  for(let i=0;i<N;i++) if(fg[i]) dep[i]*=Math.sqrt(colD[i]);
  // yumuşat
  for(let k=0;k<3;k++){ const o=dep.slice(); for(let j=1;j<h-1;j++) for(let i=1;i<w-1;i++){ const p=j*w+i; if(!fg[p]) continue; dep[p]=(o[p]*4+o[p-1]+o[p+1]+o[p-w]+o[p+w])/8; } }
  return {w,h,fg,dep,src:id,fitted:ok,bgSd};
}

function _skinLike(r,g,b){

/* el çizimi: koyu çizgileri (kâğıt gölgesine dayanıklı, yerel eşik) kapalı şekle çevirir, içini doldurur */
function _sketchFG(d,w,h){
  const N=w*h, g=new Float32Array(N); for(let i=0;i<N;i++) g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
  const R=Math.max(6,Math.round(Math.min(w,h)*.04)), ii=new Float64Array((w+1)*(h+1));
  for(let j=0;j<h;j++){ let row=0; for(let i=0;i<w;i++){ row+=g[j*w+i]; ii[(j+1)*(w+1)+i+1]=ii[j*(w+1)+i+1]+row; } }
  const mean=(i,j)=>{ const x0=Math.max(0,i-R),x1=Math.min(w,i+R+1),y0=Math.max(0,j-R),y1=Math.min(h,j+R+1);
    return (ii[y1*(w+1)+x1]-ii[y0*(w+1)+x1]-ii[y1*(w+1)+x0]+ii[y0*(w+1)+x0])/((x1-x0)*(y1-y0)); };
  let stroke=new Uint8Array(N); for(let j=0;j<h;j++) for(let i=0;i<w;i++){ const p=j*w+i; stroke[p]=(g[p]<mean(i,j)-16||g[p]<70)?1:0; }
  const grow=(src,on)=>{ const o=src.slice(); for(let j=0;j<h;j++) for(let i=0;i<w;i++){ const p=j*w+i;
    const a=i>0?src[p-1]:!on, b=i<w-1?src[p+1]:!on, c=j>0?src[p-w]:!on, e=j<h-1?src[p+w]:!on;
    if(on){ if(!src[p]&&(a||b||c||e)) o[p]=1; } else { if(src[p]&&!(a&&b&&c&&e)) o[p]=0; } } return o; };
  let bx0=w,by0=h,bx1=0,by1=0; for(let p=0;p<N;p++) if(stroke[p]){ const x=p%w,y=(p/w)|0; if(x<bx0)bx0=x; if(x>bx1)bx1=x; if(y<by0)by0=y; if(y>by1)by1=y; }
  const bbA=Math.max(1,(bx1-bx0+1)*(by1-by0+1));
  let kk=stroke, rr=0; const cand=[];
  for(const R2 of [2,4,7,10,14,19,25,32]){      // çizgiler kalınlaştıkça açık boşluklar kapanır; dolgu alanını kaydet
    while(rr<R2){ kk=grow(kk,true); rr++; }
    const bg=new Uint8Array(N), st=[]; const push=p=>{ if(!bg[p]&&!kk[p]){ bg[p]=1; st.push(p); } };
    for(let i=0;i<w;i++){ push(i); push((h-1)*w+i); } for(let j=0;j<h;j++){ push(j*w); push(j*w+w-1); }
    while(st.length){ const p=st.pop(), px=p%w, py=(p/w)|0; if(px>0) push(p-1); if(px<w-1) push(p+1); if(py>0) push(p-w); if(py<h-1) push(p+w); }

/* hero: yüzen camsı küreler */
function mountHero(container){
  container.innerHTML='';
  if(!can3D()) return;
  let renderer;
  try{ renderer=new THREE.WebGLRenderer({antialias:true,alpha:true}); }catch(e){ return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping;
  container.appendChild(renderer.domElement);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(35,1,.1,60); camera.position.z=13;
  scene.add(new THREE.AmbientLight(0xffffff,.4));
  const l1=new THREE.DirectionalLight(0xffffff,1.1); l1.position.set(4,6,9); scene.add(l1);
  const l2=new THREE.PointLight(0xff6f59,1.6,40); l2.position.set(-9,-3,5); scene.add(l2);
  const l3=new THREE.PointLight(0x5e5ce6,1.8,40); l3.position.set(9,4,3); scene.add(l3);
  const defs=[[-5.6,1.7,-1,1.55,.62],[-3.4,-2.7,1,.9,.08],[5.3,2.1,-1,1.25,.9],[3.6,-2.5,0,1.05,.15],[.2,3.7,-3,.6,.12],[-1.2,-3.9,-2,.5,.5],[7.2,-.6,-2,.62,.75],[-7.6,-1,-2,.55,.35],[1.8,2.9,-4,.4,.58]];
  const items=defs.map(([x,y,z,r,h],i)=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(r,64,48),new THREE.MeshPhysicalMaterial({color:new THREE.Color().setHSL(h,.75,.58).convertSRGBToLinear(),roughness:.2,metalness:0,clearcoat:1,clearcoatRoughness:.12}));
    m.position.set(x,y,z); scene.add(m); return {m,x,y,z,r,h,ph:i*1.7,sp:.4+((i*13)%7)/10};
  });
  const ring=new THREE.Mesh(new THREE.TorusGeometry(2.1,.045,24,160),new THREE.MeshPhysicalMaterial({color:srgbSafe('#ffffff'),roughness:.2,metalness:.9}));
  ring.position.set(0,0,-4); ring.rotation.x=1.1; scene.add(ring);
  function srgbSafe(h){ return new THREE.Color(h).convertSRGBToLinear(); }
  let mx=0,my=0,sx=1;
  function resize(){
    const w=container.clientWidth,h=container.clientHeight; if(!w||!h) return;
    renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
    sx=Math.min(1,camera.aspect*.85);
    items.forEach(it=>{ it.m.position.x=it.x*sx; const k=Math.min(1,.55+sx*.45); it.m.scale.setScalar(k); });
  }
  resize();
  const ro=('ResizeObserver' in window)?new ResizeObserver(resize):null; if(ro) ro.observe(container);
  const mv=e=>{ mx=(e.clientX/window.innerWidth-.5); my=(e.clientY/window.innerHeight-.5); };
  window.addEventListener('pointermove',mv);
  let alive=true, raf=0, visible=true, t0=performance.now();
  const vio=('IntersectionObserver' in window)?new IntersectionObserver(es=>{ visible=es[0].isIntersecting; }):null; if(vio) vio.observe(container);
  (function frame(now){
    if(!alive) return; raf=requestAnimationFrame(frame);
    if(!visible) return;
    const t=(now-t0)/1000;
    items.forEach(it=>{
      it.m.position.y=it.y+Math.sin(t*it.sp+it.ph)*.42;
      it.m.position.z=it.z+Math.cos(t*it.sp*.8+it.ph)*.3;
      it.m.material.color.setHSL((it.h+t*.012)%1,.75,.58).convertSRGBToLinear();
    });
    ring.rotation.z=t*.12; ring.rotation.y=Math.sin(t*.2)*.4;
    camera.position.x+=(mx*2.2-camera.position.x)*.04;
    camera.position.y+=(-my*1.6-camera.position.y)*.04;
    camera.lookAt(0,0,0);
    renderer.render(scene,camera);
  })(t0);
  CLEAN3D.push(()=>{
    alive=false; cancelAnimationFrame(raf); window.removeEventListener('pointermove',mv);
    if(ro) ro.disconnect(); if(vio) vio.disconnect();
    scene.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
    renderer.dispose(); try{ renderer.forceContextLoss(); }catch(e){}
    if(renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
  });
}

function onFileChosen(ev){
  const file=ev.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const maxW=1000, scale=Math.min(1,maxW/img.width);
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      S.imgDataUrl=c.toDataURL('image/jpeg',.85);
      S.imgBase64=S.imgDataUrl.split(',')[1];
      S.imgMediaType='image/jpeg';
      S.result=null; S.currentAnalysisId=null; S.viewIdx=-1; S.isPublic=false;
      S.m3d=null; S.detect=null; S.objMask=null; S.viewMode='all'; S.detectNote=''; S.instr=''; if(S.dimsAI){ S.dims={w:'',h:'',d:''}; S.dimsAI=false; }
      render(); if(AUTH) runDetect();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function detectInner(){
  const dt=S.detect;
  let st;
  if(S.detecting) st='<span class="loading-spinner" style="width:12px;height:12px;margin-right:6px"></span>Nesne algılanıyor (el, kol ve arka plan ayrılıyor)…';
  else if(dt) st='<span>✓ Nesne algılandı:</span> <b class="ai-txt">'+esc(dt.objectType||'')+'</b>'+(dt.isSketch?' <span>(el çizimi — kapalı şekle çevrildi)</span>':'')+(S.detectNote?'<br><small class="ai-txt">'+esc(S.detectNote)+'</small>':'');
  else if(!AUTH) st='Nesneyi (el/kol hariç) otomatik ayırmak ve boyut önermek için giriş yap.';
  else st='Nesne otomatik algılanamadı. Fırçayla elle düzeltebilir ya da yeniden deneyebilirsin.';
  return `<div class="ds"><div>${st}</div></div>
    ${dt?`<textarea id="instrText" rows="2" maxlength="300" placeholder="3D’ye eklemek/çıkarmak istediklerini yaz. Örn: “kablo ve fişi çıkar”, “sol taraftaki sapı da dahil et”, “boyutu 20 cm yap”" oninput="S.instr=this.value">${esc(S.instr||'')}</textarea>`:''}
    <div class="brow">
      ${dt?`<button type="button" class="pri" onclick="applyInstr()" ${S.detecting?'disabled':''}>Uygula</button>`:`<button type="button" class="pri" onclick="runDetect()" ${(!AUTH||S.detecting)?'disabled':''}>Nesneyi algıla</button>`}
      <button type="button" onclick="openMaskEditor()" ${S.objMask?'':'disabled'}>Fırçayla düzelt</button>
    </div>`;
}
function refreshDetectUI(){ const el=document.getElementById('detectBox'); if(el) el.innerHTML=detectInner(); }
function maskToPng(c){ const sc=Math.min(1,256/Math.max(c.width,c.height)), o=document.createElement('canvas'); o.width=Math.max(8,Math.round(c.width*sc)); o.height=Math.max(8,Math.round(c.height*sc)); o.getContext('2d').drawImage(c,0,0,o.width,o.height); return o.toDataURL('image/png'); }
async function pngToMask(u){ const im=await _loadImg(u), c=document.createElement('canvas'); c.width=im.width; c.height=im.height; c.getContext('2d').drawImage(im,0,0); return c; }
async function runDetect(instr){
  if(!AUTH){ openAuthModal('login'); return toast('Nesne algılama için önce giriş yapmalısın.'); }
  if(!S.imgBase64||S.detecting) return;
  const mine=S.imgDataUrl; S.detecting=true; refreshDetectUI();
  try{
    const r=await api('/api/detect',{method:'POST',body:{imageBase64:S.imgBase64,mediaType:S.imgMediaType,lang:LANG,instruction:instr||undefined,prev:(instr&&S.detect)?S.detect:undefined}});
    if(S.imgDataUrl!==mine) return;
    const dt=r.detect, pv=S.detect;
    if(instr&&pv){ dt.excludeBoxes=[...(pv.excludeBoxes||[]),...(dt.excludeBoxes||[])].slice(-6); dt.includeBoxes=[...(pv.includeBoxes||[]),...(dt.includeBoxes||[])].slice(-6); }
    S.detect=dt; S.detectNote=dt.note||'';
    S.objMask=await makeObjectMask(S.imgDataUrl,dt);
    const sd=dt.suggestedDims||{}, empty=!(parseFloat(S.dims.w)||parseFloat(S.dims.h)||parseFloat(S.dims.d));
    if((sd.w||sd.h||sd.d)&&(empty||S.dimsAI)){ S.dims={w:sd.w||'',h:sd.h||'',d:sd.d||''}; S.dimsAI=true; S.dimsReason=dt.dimsReason||''; }
    if(instr) S.instr='';
  }catch(e){ toast(e.message||'Nesne algılanamadı.'); }
  S.detecting=false; render();
}
function applyInstr(){ const t=(S.instr||'').trim(); if(t.length<3) return toast('Eklemek ya da çıkarmak istediğini yaz.'); runDetect(t); }
function setViewMode(m){ S.viewMode=m; if(STAGE) STAGE.setMode(m); document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m)); }
/* fırça editörü: yeşil = STL'ye girecek alan */
let MK=null;
async function openMaskEditor(){
  if(!S.objMask) return;
  const im=await _loadImg(S.imgDataUrl), mw=S.objMask.width, mh=S.objMask.height;
  const work=document.createElement('canvas'); work.width=mw; work.height=mh; work.getContext('2d').drawImage(S.objMask,0,0);
  MK={work,im,mode:'erase',size:Math.max(6,Math.round(Math.max(mw,mh)*.04)),mw,mh};
  document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this) closeMaskEditor()"><div class="modal" style="max-width:640px"><span class="modal-close" onclick="closeMaskEditor()">✕</span>
    <h2>Nesneyi fırçayla düzelt</h2><p class="sub">Yeşil alan 3D’ye ve STL’ye girer. “Çıkar” ile el/kol/fazlalıkları sil, “Ekle” ile eksik kısımları geri getir.</p>
    <div class="mseg" id="mkMode"><button data-m="erase" class="on" onclick="mkSetMode('erase')">Çıkar</button><button data-m="add" onclick="mkSetMode('add')">Ekle</button></div>
    <label style="display:block;margin-top:10px;font-size:13px">Fırça boyutu <input type="range" min="3" max="${Math.round(Math.max(mw,mh)*.12)}" value="${MK.size}" oninput="MK.size=+this.value" style="vertical-align:middle;width:55%"></label>
    <div class="mk-wrap"><canvas id="mkc" width="${mw}" height="${mh}"></canvas></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn-analyze" style="width:auto;padding:12px 20px" onclick="mkApply()">Uygula</button><button class="btn-save secondary" style="width:auto;padding:12px 18px" onclick="mkReset()">Otomatiğe dön</button><button class="btn-save secondary" style="width:auto;padding:12px 18px" onclick="closeMaskEditor()">Vazgeç</button></div></div></div>`;
  const cv=document.getElementById('mkc'); mkDraw();
  let down=false; const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*mw/r.width,(e.clientY-r.top)*mh/r.height]; };
  const paint=e=>{ const [x,y]=pos(e), c=MK.work.getContext('2d'); c.globalCompositeOperation=MK.mode==='erase'?'destination-out':'source-over'; c.fillStyle='#fff'; c.beginPath(); c.arc(x,y,MK.size,0,6.3); c.fill(); c.globalCompositeOperation='source-over'; mkDraw(); };
  cv.addEventListener('pointerdown',e=>{ down=true; try{cv.setPointerCapture(e.pointerId);}catch(_){} paint(e); });
  cv.addEventListener('pointermove',e=>{ if(down) paint(e); });
  const up=()=>{ down=false; }; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
}
function mkDraw(){ const cv=document.getElementById('mkc'); if(!cv||!MK) return; const x=cv.getContext('2d'); x.globalCompositeOperation='source-over'; x.clearRect(0,0,MK.mw,MK.mh); x.drawImage(MK.im,0,0,MK.mw,MK.mh);
  const t=document.createElement('canvas'); t.width=MK.mw; t.height=MK.mh; const tx=t.getContext('2d'); tx.drawImage(MK.work,0,0); tx.globalCompositeOperation='source-in'; tx.fillStyle='rgba(52,199,89,.55)'; tx.fillRect(0,0,MK.mw,MK.mh); x.drawImage(t,0,0); }
function mkSetMode(m){ if(MK) MK.mode=m; document.querySelectorAll('#mkMode button').forEach(b=>b.classList.toggle('on',b.dataset.m===m)); }
function mkApply(){ if(!MK) return; S.objMask=MK.work; MK=null; closeModal(); S.viewMode='obj'; render(); toast('Nesne güncellendi. STL yalnızca yeşil alanı içerir.'); }
async function mkReset(){ if(!MK||!S.detect) return; const c=await makeObjectMask(S.imgDataUrl,S.detect); MK.work.getContext('2d').clearRect(0,0,MK.mw,MK.mh); MK.work.getContext('2d').drawImage(c,0,0,MK.mw,MK.mh); mkDraw(); }
function closeMaskEditor(){ MK=null; closeModal(); }
window.runDetect=runDetect; window.applyInstr=applyInstr; window.setViewMode=setViewMode; window.openMaskEditor=openMaskEditor; window.mkSetMode=mkSetMode; window.mkApply=mkApply; window.mkReset=mkReset; window.closeMaskEditor=closeMaskEditor;

function barChart(daily){
  const w=700,h=170,pad=24, max=Math.max(1,...daily.map(d=>Number(d.revenue)||0), ...daily.map(d=>(Number(d.orders)||0)*100));
  const bw=(w-pad*2)/daily.length;
  const bars=daily.map((d,i)=>{ const v=Number(d.revenue)||0, o=Number(d.orders)||0; const val=v>0?v:o*100; const bh=Math.max(2,(val/max)*(h-40));
    return `<rect x="${pad+i*bw+2}" y="${h-24-bh}" width="${bw-4}" height="${bh}" rx="4" fill="${v>0?'#111':'#d9cdb8'}"><title>${d.day}: ${fmtTry(v)} · ${o} sipariş</title></rect>`; }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Son 30 gün satış grafiği">${bars}<text x="${pad}" y="${h-6}" font-size="11" fill="#8a7f6c">30 gün önce</text><text x="${w-pad}" y="${h-6}" font-size="11" fill="#8a7f6c" text-anchor="end">bugün</text></svg>`;
}

/* ---- Rehberden arkadaş bul (numaralar tarayıcıda SHA-256'lanır, saklanmaz) ---- */
function normPhone(p){
  let s=String(p).replace(/[\s()\-.]/g,''); if(s.startsWith('00')) s='+'+s.slice(2);
  if(s.startsWith('+')) return /^\+\d{10,15}$/.test(s)?s:null;
  if(!/^\d+$/.test(s)) return null;
  if(s.length===11&&s[0]==='0') return '+90'+s.slice(1);
  if(s.length===10&&s[0]==='5') return '+90'+s;
  if(s.length===12&&s.startsWith('90')) return '+'+s;
  return null;
}
async function sha256hex(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function openContactsModal(){
  if(needLogin('Rehberden arkadaş bulmak için giriş yap.')) return;
  const canPick=('contacts' in navigator)&&('ContactsManager' in window);
  document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal">
    <span class="modal-close" onclick="closeModal()">✕</span><h2>Rehberden arkadaş bul</h2>
    <p class="sub">Rehberindeki numaralar tarayıcında şifrelenir; sunucuya yalnızca şifreli özetler gönderilir, eşleşme sonrası <b>hiçbir numara saklanmaz</b>. Sadece telefonla bulunmaya izin veren kullanıcılar görünür.</p>
    <input type="file" id="vcfInput" accept=".vcf,.csv,text/vcard,text/csv,text/plain" style="display:none" onchange="onContactsFile(event)">
    ${canPick?`<button class="btn-analyze" onclick="pickContacts()">Rehberimi seç</button>`:''}
    <button class="btn-analyze" style="${canPick?'background:transparent;color:var(--blue);border:1px solid var(--blue);':''}" onclick="document.getElementById('vcfInput').click()">Rehber dosyası yükle (.vcf / .csv)</button>
    <p style="font-size:12.5px;margin-top:14px;color:var(--ink2)">${canPick?'':'Bu tarayıcı rehbere doğrudan erişemiyor. Telefonundan rehberi “.vcf” olarak dışa aktarıp buraya yükleyebilirsin (iPhone: Kişiler › Paylaş; Android: Kişiler › Dışa aktar).'}</p>
  </div></div>`;
}
window.openContactsModal=openContactsModal;
async function pickContacts(){
  try{ const picked=await navigator.contacts.select(['tel'],{multiple:true}); const tels=[]; picked.forEach(c=>(c.tel||[]).forEach(t=>tels.push(t))); await matchTels(tels); }
  catch(e){ if(e&&e.name!=='AbortError') toast('Rehbere erişilemedi.'); }
}
window.pickContacts=pickContacts;
async function onContactsFile(ev){
  const f=ev.target.files[0]; if(!f) return;
  const text=await f.text(); const m=text.match(/\+?\d[\d\s().\-]{8,}\d/g)||[];
  await matchTels(m);
}
window.onContactsFile=onContactsFile;
async function matchTels(tels){
  const set=new Set(); tels.forEach(t=>{ const n=normPhone(t); if(n) set.add(n); });
  if(!set.size){ toast('Geçerli numara bulunamadı.'); return; }
  try{
    const hashes=await Promise.all([...set].slice(0,2000).map(sha256hex));
    const d=await api('/api/contacts/match',{method:'POST',body:{hashes}});
    SOC.matches=d.items; SOC.q=''; closeModal();
    if(S.view!=='people') setView('people'); else render();
    toast(d.items.length?`${d.items.length} kişi ColorDetect’te.`:'Rehberindekilerden henüz kimse ColorDetect’te değil.');
  }catch(e){ toast(e.message); }
}
function inviteFriends(){
  const url=location.origin, text='ColorDetect’te renk analizi yap, 3D’de gör ve pazarda paylaş: ';
  if(navigator.share){ navigator.share({title:'ColorDetect',text,url}).catch(()=>{}); }
  else{ try{ navigator.clipboard.writeText(text+url); toast('Davet bağlantısı kopyalandı.'); }catch(e){ toast(url); } }
}
window.inviteFriends=inviteFriends;

/* ---- Mesajlaşma (canlı: Server-Sent Events) ---- */
function setUnread(n){ SOC.unread=Math.max(0,n); const b=document.getElementById('msgBadge'); if(b){ b.textContent=SOC.unread; b.style.display=SOC.unread?'inline-block':'none'; } }
async function refreshUnread(){ if(!AUTH) return; try{ setUnread((await api('/api/messages/unread')).unread); }catch(e){} }
async function startStream(){
  if(!AUTH||SOC.abort) return;
  const ac=new AbortController(); SOC.abort=ac;
  try{
    const res=await fetch(API_BASE+'/api/messages/stream',{headers:{Authorization:'Bearer '+AUTH.token},signal:ac.signal});
    if(!res.ok||!res.body) throw new Error('stream');
    const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';
    for(;;){ const {done,value}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true});
      let i; while((i=buf.indexOf('\n\n'))>=0){ const fr=buf.slice(0,i); buf=buf.slice(i+2); const ev=/event: (\w+)/.exec(fr), da=/data: (.*)/.exec(fr); if(ev&&da){ try{ onStreamEvent(ev[1],JSON.parse(da[1])); }catch(_){} } } }
  }catch(e){}
  SOC.abort=null; if(AUTH&&!ac.signal.aborted) setTimeout(startStream,3500);
}
function stopStream(){ if(SOC.abort){ try{ SOC.abort.abort(); }catch(e){} SOC.abort=null; } }
function onStreamEvent(ev,m){
  if(ev!=='message'||!AUTH) return;
  const incoming=m.recipient_id===AUTH.user.id, peerId=incoming?m.sender_id:m.recipient_id;
  SOC.convs=null;
  if(S.view==='messages'&&SOC.peer&&SOC.peer.id===peerId){
    if(!SOC.thread.some(x=>x.id===m.id)){ SOC.thread.push(m); renderChatPane(); }
    if(incoming) api('/api/messages/with/'+peerId).catch(()=>{});
    loadConvs(true);
  }else if(incoming){ setUnread(SOC.unread+1); toast('Yeni mesajın var.'); if(S.view==='messages') loadConvs(true); }
}
async function loadConvs(keep){
  try{ SOC.convs=(await api('/api/messages/conversations')).items; }catch(e){ SOC.convs=[]; }
  if(S.view==='messages'){ const el=document.getElementById('convList'); if(el) el.innerHTML=convListHtml(); else if(!keep) render(); }
}
function convListHtml(){
  if(SOC.convs===null) return '<div class="skeleton" style="height:60px"></div>';
  return SOC.convs.length?SOC.convs.map(c=>`<div class="conv ${SOC.peer&&SOC.peer.id===c.user_id?'on':''}" onclick="openChat('${c.user_id}')"><div class="avatar sm">${initial(c.company_name||c.name)}</div><div class="pinfo"><b>${esc(c.company_name||c.name)}</b><span>${c.mine?'Sen: ':''}${esc(c.body.slice(0,46))}</span></div>${c.unread?`<span class="ubadge">${c.unread}</span>`:''}</div>`).join(''):'<p style="padding:14px;font-size:14px">Henüz mesajın yok. Bir profilden ya da üründen “Mesaj gönder”e bas.</p>';
}
async function openChat(userId,productId){
  if(needLogin('Mesaj göndermek için giriş yap.')) return;
  if(isMe(userId)) return toast('Kendine mesaj gönderemezsin.');
  SOC.chatProduct=productId||null; SOC.thread=[]; SOC.peer=null;
  if(S.view!=='messages') setView('messages');
  try{
    const d=await api('/api/messages/with/'+userId); SOC.peer=d.peer; SOC.thread=d.items;
    if(productId&&PRODUCT_STATE&&!SOC.thread.length) SOC.draft=`Merhaba, “${PRODUCT_STATE.title||PRODUCT_STATE.ai_object_type||'ürün'}” ile ilgileniyorum.`;
    refreshUnread(); loadConvs(true); render();
    const inp=document.getElementById('chatInput'); if(inp){ inp.value=SOC.draft||''; SOC.draft=''; inp.focus(); }
  }catch(e){ toast(e.message); }
}
window.openChat=openChat;
function chatPaneHtml(){
  if(!SOC.peer) return '<div class="chat-empty">Bir sohbet seç ya da bir profilden “Mesaj gönder”e bas.</div>';
  const me=AUTH.user.id;
  return `<div class="chat-head" onclick="openUser('${esc(SOC.peer.handle)}')"><div class="avatar sm">${initial(SOC.peer.company_name||SOC.peer.name)}</div><b>${esc(SOC.peer.company_name||SOC.peer.name)}</b><span>@${esc(SOC.peer.handle)}</span></div>
    <div class="chat-body" id="chatBody">${SOC.thread.map(m=>`<div class="bub ${m.sender_id===me?'me':''}">${m.product_title?`<div class="bub-p" onclick="openProduct('${m.analysis_id}')">📎 ${esc(m.product_title)}</div>`:''}${esc(m.body)}<small>${new Date(m.created_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')||'<div class="chat-empty">Sohbeti başlat.</div>'}</div>
    <div class="chat-input"><input type="text" id="chatInput" maxlength="2000" placeholder="Mesaj yaz…" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn-lg primary" style="padding:10px 20px;font-size:14px" onclick="sendMsg()">Gönder</button></div>`;
}
function renderChatPane(){
  const el=document.getElementById('chatPane'); if(!el) return;
  const keep=(document.getElementById('chatInput')||{}).value||'';
  el.innerHTML=chatPaneHtml(); const inp=document.getElementById('chatInput'); if(inp) inp.value=keep;
  const b=document.getElementById('chatBody'); if(b) b.scrollTop=b.scrollHeight;
}
async function sendMsg(){
  const inp=document.getElementById('chatInput'); if(!inp||!SOC.peer) return; const body=inp.value.trim(); if(!body) return;
  inp.value='';
  try{ const d=await api('/api/messages',{method:'POST',body:{toUserId:SOC.peer.id,body,analysisId:SOC.chatProduct||undefined}}); SOC.chatProduct=null;
    if(!SOC.thread.some(x=>x.id===d.message.id)) SOC.thread.push(d.message); renderChatPane(); loadConvs(true); }
  catch(e){ inp.value=body; toast(e.message); }
}
window.sendMsg=sendMsg;
function renderMessages(){
  if(!AUTH) return `<div class="light-page"><section class="m-body"><div class="wrap"><div class="empty">Mesajlarını görmek için giriş yap.<br><button class="btn-lg primary" onclick="openAuthModal('login')">Giriş Yap</button></div></div></section></div>`;
  if(SOC.convs===null) loadConvs();
  requestAnimationFrame(()=>{ renderChatPane(); });
  return `<div class="light-page"><section class="m-body"><div class="wrap-wide">
    <div class="p-head rv in"><div><h2 style="font-size:36px;">Mesajlar</h2><p>Satıcılarla ve arkadaşlarınla anlık yazış.</p></div></div>
    <div class="chat-wrap"><div class="chat-side" id="convList">${convListHtml()}</div><div class="chat-main" id="chatPane"></div></div>
  </div></section></div>`;
}

  });
}
fetch(API_BASE+'/api/auth/config').then(r=>r.json()).then(c=>{ CONFIG=c||CONFIG; loadGoogle(); }).catch(()=>{});
render();
bootSocial();
initI18n();
try{
  const rt=new URLSearchParams(location.search).get('reset');
  if(rt){ RESET_TOKEN=rt; authTab='reset'; document.getElementById('modalRoot').innerHTML=renderAuthModal(); }
}catch(e){}
</script>
</body>
